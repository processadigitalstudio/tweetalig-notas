<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweetalig — Configuración de notas</title>
<link rel="stylesheet" href="../css/styles.css?v=2">
<style>
  .bloque-corte {
    background: var(--superficie);
    border: 1px solid var(--linea);
    border-radius: var(--radio);
    padding: 24px 28px;
    margin-bottom: 20px;
    max-width: 640px;
  }
  .bloque-corte h3 {
    font-family: var(--fuente-display);
    color: var(--azul-profundo);
    margin: 0 0 4px;
    font-size: 19px;
  }
  .peso-corte { color: var(--tinta-suave); font-size: 13px; margin: 0 0 18px; }
  .fila-nota {
    display: grid;
    grid-template-columns: 1fr 90px;
    gap: 12px;
    margin-bottom: 10px;
    align-items: center;
  }
  .fila-nota input[type="text"], .fila-nota input[type="number"] {
    font-family: var(--fuente-cuerpo);
    font-size: 14px;
    padding: 9px 11px;
    border: 1px solid var(--linea);
    border-radius: 7px;
    background: var(--fondo);
    color: var(--tinta);
  }
  .fila-nota input:focus { outline: 2px solid var(--azul-profundo); background: var(--superficie); }
  .suma-porcentaje { font-size: 13px; margin-top: 8px; font-weight: 500; }
  .suma-ok { color: #2E6E4E; }
  .suma-mal { color: var(--error); }
  .boton-primario { max-width: 220px; }
  .aviso-guardado { font-size: 13px; color: #2E6E4E; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>

<div class="app-shell">
  <nav class="app-nav">
    <div class="logo-nav-wrap"><img src="../assets/logo-tweetalig.png" alt="Tweetalig"></div>
    <h1>Portal de notas</h1>
    <div id="menu-rol"></div>
    <a href="#" id="link-salir">Cerrar sesión</a>
  </nav>

  <main class="app-contenido">
    <span class="etiqueta-rol">Configuración de notas</span>
    <h2>Esquema de evaluación</h2>
    <p style="color: var(--tinta-suave); max-width: 640px; margin-top: -8px;">
      Este esquema aplica igual para todas las clases. La nota final se calcula como
      <strong>corte 1 (40%) + corte 2 (60%)</strong>.
    </p>

    <div class="bloque-corte">
      <h3>Corte 1</h3>
      <p class="peso-corte">Vale 40% de la nota final</p>
      <div id="notas-corte1"></div>
      <p class="suma-porcentaje" id="suma-corte1"></p>
    </div>

    <div class="bloque-corte">
      <h3>Corte 2</h3>
      <p class="peso-corte">Vale 60% de la nota final</p>
      <div id="notas-corte2"></div>
      <p class="suma-porcentaje" id="suma-corte2"></p>
    </div>

    <button id="boton-guardar" class="boton-primario">Guardar esquema</button>
    <p class="aviso-guardado" id="aviso-guardado"></p>
  </main>
</div>

<script type="module">
  import { requireAuth } from "../js/auth.js";
  import { db } from "../js/firebase-config.js";
  import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  await requireAuth(["master"]);

  const PESO_CORTE1 = 40;
  const PESO_CORTE2 = 60;
  const REF_CONFIG = doc(db, "configuracion", "esquema_notas");

  function esquemaVacio() {
    const notasVacias = () => Array.from({ length: 5 }, (_, i) => ({
      id: `nota${i + 1}`,
      nombre: `Nota ${i + 1}`,
      porcentaje: 20
    }));
    return { corte1: notasVacias(), corte2: notasVacias() };
  }

  function pintarCorte(contenedorId, notas) {
    const contenedor = document.getElementById(contenedorId);
    contenedor.innerHTML = "";
    notas.forEach((nota, i) => {
      const fila = document.createElement("div");
      fila.className = "fila-nota";
      fila.innerHTML = `
        <input type="text" value="${nota.nombre}" data-corte="${contenedorId}" data-indice="${i}" data-campo="nombre" placeholder="Nombre de la nota">
        <input type="number" value="${nota.porcentaje}" data-corte="${contenedorId}" data-indice="${i}" data-campo="porcentaje" min="0" max="100" step="1">
      `;
      contenedor.appendChild(fila);
    });
  }

  function leerCorte(contenedorId) {
    const filas = document.querySelectorAll(`[data-corte="${contenedorId}"]`);
    const notas = [];
    filas.forEach((input) => {
      const i = Number(input.dataset.indice);
      if (!notas[i]) notas[i] = { id: `nota${i + 1}` };
      notas[i][input.dataset.campo] = input.dataset.campo === "porcentaje" ? Number(input.value) : input.value;
    });
    return notas;
  }

  function actualizarSuma(contenedorId, sumaId) {
    const notas = leerCorte(contenedorId);
    const suma = notas.reduce((acc, n) => acc + (Number(n.porcentaje) || 0), 0);
    const el = document.getElementById(sumaId);
    el.textContent = `Suma actual: ${suma}%` + (suma === 100 ? " — correcto" : " — debe sumar 100%");
    el.className = "suma-porcentaje " + (suma === 100 ? "suma-ok" : "suma-mal");
    return suma === 100;
  }

  // Cargar esquema existente o usar valores por defecto
  const snap = await getDoc(REF_CONFIG);
  const esquema = snap.exists() ? snap.data() : esquemaVacio();

  pintarCorte("notas-corte1", esquema.corte1);
  pintarCorte("notas-corte2", esquema.corte2);
  actualizarSuma("notas-corte1", "suma-corte1");
  actualizarSuma("notas-corte2", "suma-corte2");

  document.addEventListener("input", (e) => {
    if (e.target.dataset.corte === "notas-corte1") actualizarSuma("notas-corte1", "suma-corte1");
    if (e.target.dataset.corte === "notas-corte2") actualizarSuma("notas-corte2", "suma-corte2");
  });

  document.getElementById("boton-guardar").addEventListener("click", async () => {
    const aviso = document.getElementById("aviso-guardado");
    const okCorte1 = actualizarSuma("notas-corte1", "suma-corte1");
    const okCorte2 = actualizarSuma("notas-corte2", "suma-corte2");

    if (!okCorte1 || !okCorte2) {
      aviso.style.color = "var(--error)";
      aviso.textContent = "No se guardó: revisa que cada corte sume exactamente 100%.";
      return;
    }

    await setDoc(REF_CONFIG, {
      corte1: leerCorte("notas-corte1"),
      corte2: leerCorte("notas-corte2"),
      pesoCorte1: PESO_CORTE1,
      pesoCorte2: PESO_CORTE2
    });

    aviso.style.color = "#2E6E4E";
    aviso.textContent = "Esquema guardado. Los profesores ya ven estos nombres y porcentajes.";
  });
</script>
</body>
</html>
