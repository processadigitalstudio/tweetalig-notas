<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweetalig — Profesores</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  .tabla-simple { width: 100%; border-collapse: collapse; max-width: 780px; margin-bottom: 28px; }
  .tabla-simple th, .tabla-simple td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--linea); font-size: 14px; }
  .tabla-simple th { color: var(--tinta-suave); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  .form-tarjeta { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); padding: 24px 28px; max-width: 480px; }
  .form-tarjeta label { display: block; font-size: 13px; font-weight: 500; color: var(--tinta-suave); margin-top: 12px; margin-bottom: 4px; }
  .form-tarjeta input, .form-tarjeta select { width: 100%; font-family: var(--fuente-cuerpo); font-size: 14px; padding: 9px 11px; border: 1px solid var(--linea); border-radius: 7px; background: var(--fondo); color: var(--tinta); }
  .form-tarjeta input:focus, .form-tarjeta select:focus { outline: 2px solid var(--azul-profundo); background: var(--superficie); }
  .boton-primario { max-width: 220px; margin-top: 18px; }
  .aviso { font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="app-nav">
    <div class="logo-nav-wrap"><img src="../assets/logo-tweetalig.png" alt="Tweetalig"></div>
    <h1>Portal de notas</h1>
    <div id="menu-rol"></div>
    <a href="#" id="link-salir">Cerrar sesión</a>
  </nav>
  <main class="app-contenido">
    <span class="etiqueta-rol">Profesores</span>
    <h2>Profesores registrados</h2>
    <p style="color: var(--tinta-suave); max-width: 560px; margin-top: -8px;">
      Registra al profesor con su correo de Tweetalig. En cuanto inicie sesión con Google por primera vez, el sistema ya lo reconoce con este rol.
    </p>

    <table class="tabla-simple">
      <thead><tr><th>Nombre</th><th>Correo</th><th>Sede</th></tr></thead>
      <tbody id="lista-profesores"></tbody>
    </table>

    <div class="form-tarjeta">
      <h3 style="font-family: var(--fuente-display); color: var(--azul-profundo); margin: 0;">Registrar profesor</h3>
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" placeholder="María Torres">

      <label for="correo">Correo (@tweetalig.edu.co)</label>
      <input type="email" id="correo" placeholder="maria.torres@tweetalig.edu.co">

      <label for="ciudad">Sede</label>
      <select id="ciudad"></select>

      <button id="boton-guardar" class="boton-primario">Registrar profesor</button>
      <p class="aviso" id="aviso"></p>
    </div>
  </main>
</div>

<script type="module">
  import { requireAuth } from "../js/auth.js";
  import { db, DOMINIO_PERMITIDO } from "../js/firebase-config.js";
  import { collection, doc, setDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const { rol } = await requireAuth(["master", "coordinador", "secretaria"]);

  async function cargarSedes() {
    const select = document.getElementById("ciudad");
    select.innerHTML = "";
    const snap = await getDocs(collection(db, "ciudades"));
    if (snap.empty) {
      select.innerHTML = "<option value=''>No hay sedes registradas todavía</option>";
      return;
    }
    snap.forEach((d) => {
      const opt = document.createElement("option");
      opt.value = d.id;
      opt.textContent = d.data().nombre;
      select.appendChild(opt);
    });
  }

  async function cargarProfesores() {
    const cuerpo = document.getElementById("lista-profesores");
    cuerpo.innerHTML = "";
    const q = query(collection(db, "usuarios"), where("rol", "==", "profesor"));
    const snap = await getDocs(q);
    snap.forEach((d) => {
      const p = d.data();
      const fila = document.createElement("tr");
      fila.innerHTML = `<td>${p.nombre || "—"}</td><td>${d.id}</td><td>${p.ciudadNombre || "—"}</td>`;
      cuerpo.appendChild(fila);
    });
  }

  document.getElementById("boton-guardar").addEventListener("click", async () => {
    const nombre = document.getElementById("nombre").value.trim();
    const correo = document.getElementById("correo").value.trim().toLowerCase();
    const selectCiudad = document.getElementById("ciudad");
    const ciudadId = selectCiudad.value;
    const ciudadNombre = selectCiudad.options[selectCiudad.selectedIndex]?.textContent || "";
    const aviso = document.getElementById("aviso");

    if (!nombre || !correo) {
      aviso.style.color = "var(--error)";
      aviso.textContent = "Completa nombre y correo.";
      return;
    }
    if (!correo.endsWith("@" + DOMINIO_PERMITIDO)) {
      aviso.style.color = "var(--error)";
      aviso.textContent = `El correo debe terminar en @${DOMINIO_PERMITIDO}.`;
      return;
    }

    await setDoc(doc(db, "usuarios", correo), {
      nombre, rol: "profesor", ciudadId, ciudadNombre
    });

    aviso.style.color = "#2E6E4E";
    aviso.textContent = `Profesor ${nombre} registrado.`;
    document.getElementById("nombre").value = "";
    document.getElementById("correo").value = "";
    cargarProfesores();
  });

  await cargarSedes();
  await cargarProfesores();
</script>
</body>
</html>
