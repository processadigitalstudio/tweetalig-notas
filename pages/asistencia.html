<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweetalig — Asistencia</title>
<link rel="stylesheet" href="../css/styles.css?v=2">
<style>
  .selector-clase { max-width: 480px; margin-bottom: 20px; }
  .selector-clase select { width: 100%; font-family: var(--fuente-cuerpo); font-size: 14px; padding: 10px 12px; border: 1px solid var(--linea); border-radius: 7px; background: var(--fondo); color: var(--tinta); }

  .lista-fechas { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; max-width: 900px; }
  .pastilla-fecha {
    font-family: var(--fuente-cuerpo); font-size: 12.5px; font-weight: 500;
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--linea);
    background: var(--superficie); color: var(--tinta); cursor: pointer; text-align: center; min-width: 78px;
  }
  .pastilla-fecha .dia-semana { display:block; font-size: 10.5px; color: var(--tinta-suave); text-transform: uppercase; }
  .pastilla-fecha.activa { background: var(--azul-profundo); color: #fff; border-color: var(--azul-profundo); }
  .pastilla-fecha.activa .dia-semana { color: #cfe0ea; }
  .pastilla-fecha.es-festivo { background: var(--oro-suave); border-color: var(--oro); }
  .pastilla-fecha.es-festivo.activa { background: var(--oro); color: var(--tinta); border-color: var(--oro); }

  .info-bloques { font-size: 13px; color: var(--tinta-suave); margin-bottom: 14px; }

  .tabla-asistencia { width: 100%; border-collapse: collapse; max-width: 750px; }
  .tabla-asistencia th, .tabla-asistencia td { padding: 9px 10px; border-bottom: 1px solid var(--linea); font-size: 13.5px; text-align: left; }
  .tabla-asistencia th { color: var(--tinta-suave); font-weight: 500; font-size: 11px; text-transform: uppercase; text-align: center; }
  .tabla-asistencia th:first-child, .tabla-asistencia th:nth-child(2) { text-align: left; }
  .tabla-asistencia td.celda-bloque { text-align: center; }
  .tabla-asistencia input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
  .col-horas { font-weight: 600; color: var(--error); text-align: center; }

  .toggle-festivo { display:flex; align-items:center; gap:8px; margin-bottom:16px; font-size:14px; }
  .boton-primario { max-width: 240px; margin-top: 18px; }
  .boton-secundario {
    font-family: var(--fuente-cuerpo); font-size: 12.5px; font-weight: 500;
    color: var(--azul-profundo); background: none; border: 1px dashed var(--azul-profundo);
    border-radius: 6px; padding: 7px 12px; cursor: pointer;
  }
  .aviso { font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="app-nav">
    <div class="logo-nav-wrap"><img src="../assets/logo-tweetalig.png" alt="Tweetalig"></div>
    <h1>Portal de notas</h1>
    <div id="menu-rol"></div>
    <a href="#" id="link-salir">Cerrar sesión</a>
  </nav>
  <main class="app-contenido">
    <span class="etiqueta-rol">Asistencia</span>
    <h2>Registrar asistencia</h2>
    <p style="color: var(--tinta-suave); max-width: 600px; margin-top: -8px; font-size: 13.5px;">
      Solo marca la casilla del bloque en que el estudiante <b>faltó</b> — si no marcas nada, se asume presente.
      Un bloque presencial dura 45 min, uno a distancia 60 min.
    </p>

    <div id="selector-profesor" style="display:none; margin-bottom:16px;">
      <label style="display:block; font-size:13px; font-weight:500; color:var(--tinta-suave); margin-bottom:4px;">Ver como profesor (solo para revisión)</label>
      <select id="profesor-vista" style="max-width:420px; padding:8px 10px; border:1px solid var(--linea); border-radius:7px;"></select>
    </div>

    <div class="selector-clase">
      <label style="display:block; font-size:13px; font-weight:500; color:var(--tinta-suave); margin-bottom:4px;">Clase</label>
      <select id="selector-clase"></select>
    </div>

    <div id="candado-edicion" style="display:none; margin-bottom:16px;">
      <span id="estado-candado" style="font-size:13px; color:var(--tinta-suave);">🔒 Modo solo lectura — solo el profesor puede registrar asistencia.</span>
      <button type="button" class="boton-secundario" id="boton-desbloquear" style="margin-left:10px;">Desbloquear edición</button>
    </div>

    <div id="contenido-asistencia"></div>
  </main>
</div>

<script type="module">
  import { requireAuth, registrarLog } from "../js/auth.js?v=3";
  import { db } from "../js/firebase-config.js?v=3";
  import { collection, getDocs, getDoc, doc, setDoc, query, where } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const { usuario, rol } = await requireAuth(["profesor", "master", "admin"]);

  let edicionDesbloqueada = (rol === "profesor");

  if (rol === "master" || rol === "admin") {
    document.getElementById("candado-edicion").style.display = "block";
    document.getElementById("boton-desbloquear").addEventListener("click", async () => {
      const intento = prompt("Escribe la contraseña de edición:");
      if (intento === null) return;
      const snapClave = await getDoc(doc(db, "configuracion", "claveEdicion"));
      const claveReal = snapClave.exists() ? snapClave.data().clave : null;
      if (!claveReal) {
        alert("Todavía no se ha configurado una contraseña de edición. Pídele a Master que la configure en 'Accesos y usuarios'.");
        return;
      }
      if (intento === claveReal) {
        edicionDesbloqueada = true;
        document.getElementById("estado-candado").textContent = "🔓 Edición desbloqueada — los cambios que hagas se guardan igual que si fueran del profesor.";
        document.getElementById("boton-desbloquear").style.display = "none";
        pintarDia();
      } else {
        alert("Contraseña incorrecta.");
      }
    });
  }

  const DIAS_SEMANA = { "Domingo": 0, "Lunes": 1, "Martes": 2, "Miércoles": 3, "Jueves": 4, "Viernes": 5, "Sábado": 6 };
  const DIAS_CORTOS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

  let correoActivo = usuario.email.toLowerCase();
  let gruposClase = [];

  if (rol === "master" || rol === "admin") {
    document.getElementById("selector-profesor").style.display = "block";
    const selectProf = document.getElementById("profesor-vista");
    const snapProf = await getDocs(query(collection(db, "usuarios"), where("rol", "==", "profesor")));
    selectProf.innerHTML = "";
    snapProf.forEach((d) => {
      const opt = document.createElement("option");
      opt.value = d.id;
      opt.textContent = d.data().nombre;
      selectProf.appendChild(opt);
    });

    const params = new URLSearchParams(window.location.search);
    const correoDesdeUrl = params.get("correo");
    if (correoDesdeUrl && [...selectProf.options].some((o) => o.value === correoDesdeUrl)) {
      selectProf.value = correoDesdeUrl;
      correoActivo = correoDesdeUrl;
    } else if (!snapProf.empty) {
      correoActivo = selectProf.options[0].value;
    }

    selectProf.addEventListener("change", async () => {
      correoActivo = selectProf.value;
      await cargarGrupos();
    });
  }

  async function cargarGrupos() {
    const q = query(collection(db, "clases"), where("docenteCorreo", "==", correoActivo));
    const snap = await getDocs(q);
    const clases = snap.docs.map((d) => ({ id: d.id, ...d.data() }));

    const porClave = {};
    clases.forEach((c) => {
      const clave = c.grupoDistanciaId || c.id;
      if (!porClave[clave]) porClave[clave] = [];
      porClave[clave].push(c);
    });

    gruposClase = Object.entries(porClave).map(([key, clasesGrupo]) => {
      clasesGrupo.sort((a, b) => (a.id < b.id ? -1 : 1));
      const primera = clasesGrupo[0];
      const sedes = clasesGrupo.map((c) => c.ciudadNombre).join(", ");
      return {
        key,
        claseAncla: clasesGrupo[0].id,
        esDistancia: (primera.programaNombre || "").toLowerCase().includes("distancia"),
        etiqueta: `${primera.nivel} - ${primera.grupo} (${sedes}) — ${primera.anio}-${primera.periodo} Ciclo ${primera.ciclo}`,
        clases: clasesGrupo
      };
    });

    const select = document.getElementById("selector-clase");
    select.innerHTML = "";
    if (gruposClase.length === 0) {
      select.innerHTML = "<option value=''>No tienes clases asignadas</option>";
      document.getElementById("contenido-asistencia").innerHTML = "";
      return;
    }
    gruposClase.forEach((g) => {
      const opt = document.createElement("option");
      opt.value = g.key;
      opt.textContent = g.etiqueta;
      select.appendChild(opt);
    });

    const params = new URLSearchParams(window.location.search);
    const grupoDesdeUrl = params.get("grupo");
    const claveInicial = (grupoDesdeUrl && gruposClase.some((g) => g.key === grupoDesdeUrl)) ? grupoDesdeUrl : gruposClase[0].key;
    select.value = claveInicial;

    await cargarCalendario(claveInicial);
  }

  document.getElementById("selector-clase").addEventListener("change", (e) => cargarCalendario(e.target.value));

  let fechasSesion = []; // [{fecha: Date, horario: {...}, bloqueMin, numBloques}]
  let fechaActivaTexto = null;
  let estudiantesActuales = [];
  let sesionesGuardadas = {};
  let grupoActual = null;

  function formatoFecha(d) { return d.toISOString().slice(0, 10); }

  function minutosEntre(horaInicio, horaFin) {
    const [h1, m1] = horaInicio.split(":").map(Number);
    const [h2, m2] = horaFin.split(":").map(Number);
    return (h2 * 60 + m2) - (h1 * 60 + m1);
  }

  async function cargarCalendario(claveGrupo) {
    grupoActual = gruposClase.find((g) => g.key === claveGrupo);
    const contenedor = document.getElementById("contenido-asistencia");
    contenedor.innerHTML = "<p style='color:var(--tinta-suave);'>Cargando...</p>";

    try {
      const primera = grupoActual.clases[0];
      const idPeriodo = `${primera.anio}-${primera.periodo}-${primera.ciclo}`;
      const snapPeriodo = await getDoc(doc(db, "periodos", idPeriodo));

      if (!snapPeriodo.exists() || !snapPeriodo.data().fechaInicio || !snapPeriodo.data().fechaFin) {
        contenedor.innerHTML = `<p style="color:var(--error);">El período ${idPeriodo} todavía no tiene fecha de inicio/fin configurada. Pide que la agreguen en "Períodos académicos".</p>`;
        return;
      }
      const per = snapPeriodo.data();
      const inicio = new Date(per.fechaInicio + "T00:00:00");
      const fin = new Date(per.fechaFin + "T00:00:00");

      const bloqueMin = grupoActual.esDistancia ? 60 : 45;
      const horarios = primera.horarios || [];

      fechasSesion = [];
      for (let d = new Date(inicio); d <= fin; d.setDate(d.getDate() + 1)) {
        const horario = horarios.find((h) => DIAS_SEMANA[h.dia] === d.getDay());
        if (!horario) continue;
        const duracion = minutosEntre(horario.horaInicio, horario.horaFin);
        const numBloques = Math.max(1, Math.round(duracion / bloqueMin));
        fechasSesion.push({ fecha: new Date(d), horario, numBloques, bloqueMin });
      }

      const snapSesiones = await getDocs(collection(db, "clases", grupoActual.claseAncla, "sesiones"));
      sesionesGuardadas = {};
      snapSesiones.forEach((d) => { sesionesGuardadas[d.id] = d.data(); });

      const idsClases = grupoActual.clases.map((c) => c.id);
      let estudiantes = [];
      for (let i = 0; i < idsClases.length; i += 10) {
        const lote = idsClases.slice(i, i + 10);
        const q = query(collection(db, "estudiantes"), where("claseId", "in", lote));
        const snap = await getDocs(q);
        snap.forEach((d) => estudiantes.push({ id: d.id, ...d.data() }));
      }
      estudiantes.sort((a, b) => (a.apellido || "").localeCompare(b.apellido || ""));
      estudiantesActuales = estudiantes;

      pintarFechas();
      pintarResumenAsistencia();
    } catch (error) {
      console.error("Error cargando asistencia:", error);
      contenedor.innerHTML = `<p style="color:var(--error);">No se pudo cargar (${error.code || error.message}).</p>`;
    }
  }

  function pintarFechas() {
    const contenedor = document.getElementById("contenido-asistencia");
    contenedor.innerHTML = "";

    if (fechasSesion.length === 0) {
      contenedor.innerHTML = "<p style='color:var(--tinta-suave);'>No hay sesiones calculadas — revisa que la clase tenga horarios y el período tenga fechas.</p>";
      return;
    }

    const lista = document.createElement("div");
    lista.className = "lista-fechas";
    fechasSesion.forEach((s) => {
      const fechaTexto = formatoFecha(s.fecha);
      const guardada = sesionesGuardadas[fechaTexto];
      const btn = document.createElement("button");
      btn.className = "pastilla-fecha" +
        (fechaTexto === fechaActivaTexto ? " activa" : "") +
        (guardada?.festivo ? " es-festivo" : "");
      btn.innerHTML = `<span class="dia-semana">${DIAS_CORTOS[s.fecha.getDay()]}</span>${s.fecha.getDate()}/${s.fecha.getMonth() + 1}`;
      btn.addEventListener("click", () => {
        fechaActivaTexto = fechaTexto;
        pintarFechas();
        pintarDia();
      });
      lista.appendChild(btn);
    });
    contenedor.appendChild(lista);

    const filaExtra = document.createElement("div");
    filaExtra.style.cssText = "display:flex; gap:8px; align-items:center; margin-bottom:18px; flex-wrap: wrap;";
    filaExtra.innerHTML = `
      <input type="date" id="input-fecha-extra" style="font-size:13px; padding:7px 9px; border:1px solid var(--linea); border-radius:6px;">
      <button type="button" class="boton-secundario" id="boton-agregar-fecha-extra">+ Agregar fecha (clase extra / recuperación)</button>
      <button type="button" class="boton-secundario" id="boton-ver-resumen">Ver resumen de horas de inasistencia</button>
    `;
    contenedor.appendChild(filaExtra);

    document.getElementById("boton-agregar-fecha-extra").addEventListener("click", () => {
      const valor = document.getElementById("input-fecha-extra").value;
      if (!valor) return;
      if (!fechasSesion.some((s) => formatoFecha(s.fecha) === valor)) {
        const bloqueMin = grupoActual.esDistancia ? 60 : 60; // fecha extra: bloque completo por defecto
        fechasSesion.push({ fecha: new Date(valor + "T00:00:00"), horario: null, numBloques: 1, bloqueMin });
        fechasSesion.sort((a, b) => a.fecha - b.fecha);
      }
      fechaActivaTexto = valor;
      pintarFechas();
      pintarDia();
    });

    document.getElementById("boton-ver-resumen").addEventListener("click", pintarResumenAsistencia);

    const div = document.createElement("div");
    div.id = "cuerpo-dia";
    contenedor.appendChild(div);
  }

  function pintarDia() {
    const cuerpo = document.getElementById("cuerpo-dia");
    const sesionInfo = fechasSesion.find((s) => formatoFecha(s.fecha) === fechaActivaTexto);
    const numBloques = sesionInfo?.numBloques || 1;
    const bloqueMin = sesionInfo?.bloqueMin || 60;
    const guardada = sesionesGuardadas[fechaActivaTexto] || { festivo: false, ausencias: {} };

    cuerpo.innerHTML = `
      <p class="info-bloques">${numBloques} bloque(s) de ${bloqueMin} min ese día.</p>
      <label class="toggle-festivo">
        <input type="checkbox" id="chk-festivo" ${guardada.festivo ? "checked" : ""} ${edicionDesbloqueada ? "" : "disabled"}>
        Marcar este día como festivo (no hay clase / no se toma asistencia)
      </label>
      <div id="zona-estudiantes"></div>
    `;

    const chkFestivo = document.getElementById("chk-festivo");
    const zona = document.getElementById("zona-estudiantes");

    function pintarTablaEstudiantes() {
      if (chkFestivo.checked) { zona.innerHTML = ""; return; }

      const tabla = document.createElement("table");
      tabla.className = "tabla-asistencia";
      let theadHtml = `<tr><th>No.</th><th>ID</th><th>Estudiante</th>`;
      for (let b = 1; b <= numBloques; b++) theadHtml += `<th>Bloque ${b}</th>`;
      theadHtml += `<th>Horas ausente</th></tr>`;
      tabla.innerHTML = `<thead>${theadHtml}</thead><tbody></tbody>`;
      const tbody = tabla.querySelector("tbody");

      estudiantesActuales.forEach((est, idx) => {
        const marcados = guardada.ausencias?.[est.cedula] || [];
        let celdas = `<td>${idx + 1}</td><td>${est.cedula}</td><td>${est.apellido} ${est.nombre}</td>`;
        for (let b = 0; b < numBloques; b++) {
          celdas += `<td class="celda-bloque"><input type="checkbox" class="chk-bloque" data-cedula="${est.cedula}" data-bloque="${b}" ${marcados[b] ? "checked" : ""} ${edicionDesbloqueada ? "" : "disabled"}></td>`;
        }
        celdas += `<td class="col-horas" id="horas-${est.cedula}">${((marcados.filter(Boolean).length) * bloqueMin / 60).toFixed(2)}</td>`;
        const fila = document.createElement("tr");
        fila.innerHTML = celdas;
        tbody.appendChild(fila);
      });

      zona.innerHTML = "";
      zona.appendChild(tabla);

      tabla.querySelectorAll(".chk-bloque").forEach((chk) => {
        chk.addEventListener("change", () => {
          const cedula = chk.dataset.cedula;
          const b = Number(chk.dataset.bloque);
          if (!guardada.ausencias) guardada.ausencias = {};
          if (!guardada.ausencias[cedula]) guardada.ausencias[cedula] = new Array(numBloques).fill(false);
          guardada.ausencias[cedula][b] = chk.checked;
          const totalHoras = guardada.ausencias[cedula].filter(Boolean).length * bloqueMin / 60;
          document.getElementById(`horas-${cedula}`).textContent = totalHoras.toFixed(2);
        });
      });
    }

    chkFestivo.addEventListener("change", pintarTablaEstudiantes);
    pintarTablaEstudiantes();

    const botonGuardar = document.createElement("button");
    botonGuardar.className = "boton-primario";
    botonGuardar.textContent = "Guardar asistencia de este día";
    botonGuardar.style.display = edicionDesbloqueada ? "block" : "none";
    botonGuardar.addEventListener("click", async () => {
      const aviso = document.getElementById("aviso-asistencia");
      aviso.textContent = "Guardando...";
      await setDoc(doc(db, "clases", grupoActual.claseAncla, "sesiones", fechaActivaTexto), {
        fecha: fechaActivaTexto,
        festivo: chkFestivo.checked,
        numBloques, bloqueMin,
        ausencias: chkFestivo.checked ? {} : (guardada.ausencias || {})
      });
      sesionesGuardadas[fechaActivaTexto] = { fecha: fechaActivaTexto, festivo: chkFestivo.checked, numBloques, bloqueMin, ausencias: guardada.ausencias || {} };
      await registrarLog(usuario, rol, "Guardó asistencia", `${fechaActivaTexto} — ${grupoActual.etiqueta}`);
      pintarFechas();
      pintarDia();
      document.getElementById("aviso-asistencia").textContent = "Asistencia guardada correctamente.";
      document.getElementById("aviso-asistencia").style.color = "#2E6E4E";
    });
    cuerpo.appendChild(botonGuardar);

    const aviso = document.createElement("p");
    aviso.className = "aviso";
    aviso.id = "aviso-asistencia";
    cuerpo.appendChild(aviso);
  }

  function pintarResumenAsistencia() {
    const cuerpo = document.getElementById("cuerpo-dia");
    const horasTotales = {};
    estudiantesActuales.forEach((est, idx) => { horasTotales[est.cedula] = 0; });

    Object.values(sesionesGuardadas).forEach((sesion) => {
      if (sesion.festivo) return;
      const bloqueMin = sesion.bloqueMin || 60;
      Object.entries(sesion.ausencias || {}).forEach(([cedula, marcados]) => {
        if (horasTotales[cedula] === undefined) horasTotales[cedula] = 0;
        const bloquesMarcados = (marcados || []).filter(Boolean).length;
        horasTotales[cedula] += bloquesMarcados * bloqueMin / 60;
      });
    });

    const tabla = document.createElement("table");
    tabla.className = "tabla-asistencia";
    tabla.innerHTML = `<thead><tr><th>No.</th><th>ID</th><th>Estudiante</th><th>Horas de inasistencia</th></tr></thead><tbody></tbody>`;
    const tbody = tabla.querySelector("tbody");

    estudiantesActuales.forEach((est, idx) => {
      const horas = horasTotales[est.cedula] || 0;
      const alerta = horas >= 2 ? ` style="color:var(--error); font-weight:600;"` : "";
      const fila = document.createElement("tr");
      fila.innerHTML = `<td>${idx + 1}</td><td>${est.cedula}</td><td>${est.apellido} ${est.nombre}</td><td${alerta}>${horas.toFixed(2)}${horas >= 2 ? " ⚠" : ""}</td>`;
      tbody.appendChild(fila);
    });

    cuerpo.innerHTML = "";
    cuerpo.appendChild(tabla);
  }

  await cargarGrupos();
</script>
</body>
</html>
