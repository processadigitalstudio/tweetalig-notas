<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweetalig — Asistencia</title>
<link rel="stylesheet" href="../css/styles.css?v=2">
<style>
  .selector-clase { max-width: 480px; margin-bottom: 20px; }
  .selector-clase select { width: 100%; font-family: var(--fuente-cuerpo); font-size: 14px; padding: 10px 12px; border: 1px solid var(--linea); border-radius: 7px; background: var(--fondo); color: var(--tinta); }

  .lista-fechas { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; max-width: 900px; }
  .pastilla-fecha {
    font-family: var(--fuente-cuerpo); font-size: 12.5px; font-weight: 500;
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--linea);
    background: var(--superficie); color: var(--tinta); cursor: pointer; text-align: center; min-width: 78px;
  }
  .pastilla-fecha .dia-semana { display:block; font-size: 10.5px; color: var(--tinta-suave); text-transform: uppercase; }
  .pastilla-fecha.activa { background: var(--azul-profundo); color: #fff; border-color: var(--azul-profundo); }
  .pastilla-fecha.activa .dia-semana { color: #cfe0ea; }
  .pastilla-fecha.es-festivo { background: var(--oro-suave); border-color: var(--oro); }
  .pastilla-fecha.es-speaking { background: #e6e0f3; border-color: #9575cd; }
  .pastilla-fecha.es-speaking.activa { background: #9575cd; color: #fff; border-color: #9575cd; }
  .pastilla-fecha .etiqueta-speaking { display:block; font-size: 10px; font-weight:600; }
  .pastilla-fecha.es-festivo.activa { background: var(--oro); color: var(--tinta); border-color: var(--oro); }

  .info-bloques { font-size: 13px; color: var(--tinta-suave); margin-bottom: 14px; }

  .tabla-asistencia { width: 100%; border-collapse: collapse; max-width: 750px; }
  .tabla-asistencia th, .tabla-asistencia td { padding: 9px 10px; border-bottom: 1px solid var(--linea); font-size: 13.5px; text-align: left; }
  .tabla-asistencia th { color: var(--tinta-suave); font-weight: 500; font-size: 11px; text-transform: uppercase; text-align: center; }
  .tabla-asistencia th:first-child, .tabla-asistencia th:nth-child(2) { text-align: left; }
  .tabla-asistencia td.celda-bloque { text-align: center; }
  .tabla-asistencia input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
  .col-horas { font-weight: 600; color: var(--error); text-align: center; }

  .toggle-festivo { display:flex; align-items:center; gap:8px; margin-bottom:16px; font-size:14px; }
  .boton-primario { max-width: 240px; margin-top: 18px; }
  .boton-secundario {
    font-family: var(--fuente-cuerpo); font-size: 12.5px; font-weight: 500;
    color: var(--azul-profundo); background: none; border: 1px dashed var(--azul-profundo);
    border-radius: 6px; padding: 7px 12px; cursor: pointer;
  }
  .aviso { font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="app-nav">
    <div class="logo-nav-wrap"><img src="../assets/logo-tweetalig.png" alt="Tweetalig"></div>
    <h1>Portal de notas</h1>
    <div id="menu-rol"></div>
    <a href="#" id="link-salir">Cerrar sesión</a>
  </nav>
  <main class="app-contenido">
    <span class="etiqueta-rol">Asistencia</span>
    <h2>Registrar asistencia</h2>
    <p style="color: var(--tinta-suave); max-width: 600px; margin-top: -8px; font-size: 13.5px;">
      Solo marca la casilla del bloque en que el estudiante <b>faltó</b> — si no marcas nada, se asume presente.
      Un bloque presencial dura 45 min, uno a distancia 60 min.
    </p>

    <div id="selector-profesor" style="display:none; margin-bottom:16px;">
      <label style="display:block; font-size:13px; font-weight:500; color:var(--tinta-suave); margin-bottom:4px;">Ver como profesor (solo para revisión)</label>
      <select id="profesor-vista" style="max-width:420px; padding:8px 10px; border:1px solid var(--linea); border-radius:7px;"></select>
    </div>

    <div class="selector-clase">
      <label style="display:block; font-size:13px; font-weight:500; color:var(--tinta-suave); margin-bottom:4px;">Clase</label>
      <select id="selector-clase"></select>
    </div>

    <div id="candado-edicion" style="display:none; margin-bottom:16px;">
      <span id="estado-candado" style="font-size:13px; color:var(--tinta-suave);">🔒 Modo solo lectura — solo el profesor puede registrar asistencia.</span>
      <button type="button" class="boton-secundario" id="boton-desbloquear" style="margin-left:10px;">Desbloquear edición</button>
    </div>

    <div id="contenido-asistencia"></div>
    <div id="panel-estudiantes"></div>
  </main>
</div>

<script type="module">
  import { requireAuth, registrarLog } from "../js/auth.js?v=3";
  import { claveGrupo as claveDeGrupo } from "../js/grupos.js?v=1";
  import { montarSelectorProfesor } from "../js/selector-profesor.js?v=1";
  import { calcularUmbrales, estadoInasistencia, ETIQUETA_ESTADO } from "../js/umbrales.js?v=1";
  import { db } from "../js/firebase-config.js?v=3";
  import { collection, getDocs, getDoc, doc, setDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { badgeReporte, separarMovidos, montarPanelProfesor, cargarEstudiantesDeClases } from "../js/matricula.js?v=1";

  const { usuario, rol, perfil } = await requireAuth(["profesor", "master", "admin", "coordinador", "secretaria"]);

  // Coordinador, secretaria y Master pueden editar asistencia directamente.
  // Solo Admin necesita su propia contraseña (guardada en su perfil).
  let edicionDesbloqueada = (rol === "profesor" || rol === "coordinador" || rol === "secretaria" || rol === "master");

  if (rol === "admin") {
    document.getElementById("candado-edicion").style.display = "block";
    document.getElementById("boton-desbloquear").addEventListener("click", () => {
      const intento = prompt("Escribe tu contraseña de edición:");
      if (intento === null) return;
      const claveReal = perfil?.claveEdicion || null;
      if (!claveReal) {
        alert("Tu cuenta Admin todavía no tiene una contraseña de edición configurada. Pídele a Master que te la asigne en 'Accesos y usuarios'.");
        return;
      }
      if (intento === claveReal) {
        edicionDesbloqueada = true;
        document.getElementById("estado-candado").textContent = "🔓 Edición desbloqueada — los cambios que hagas se guardan igual que si fueran del profesor.";
        document.getElementById("boton-desbloquear").style.display = "none";
        if (document.getElementById("cuerpo-dia") && fechaActivaTexto) pintarDia();
        else if (grupoActual) cargarCalendario(grupoActual.key);
      } else {
        alert("Contraseña incorrecta.");
      }
    });
  }

  const DIAS_SEMANA = { "Domingo": 0, "Lunes": 1, "Martes": 2, "Miércoles": 3, "Jueves": 4, "Viernes": 5, "Sábado": 6 };
  const DIAS_CORTOS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

  let correoActivo = usuario.email.toLowerCase();
  let gruposClase = [];

  if (rol === "master" || rol === "admin" || rol === "coordinador" || rol === "secretaria") {
    const correoDesdeUrl = new URLSearchParams(window.location.search).get("correo");
    const { correoInicial } = await montarSelectorProfesor({
      db, rol, perfil, correoDesdeUrl,
      alCambiar: async (correo) => { correoActivo = correo; await cargarGrupos(); }
    });
    correoActivo = correoInicial;
  }

  async function cargarGrupos() {
    if (!correoActivo) {
      document.getElementById("panel-estudiantes").innerHTML = "";
      document.getElementById("selector-clase").innerHTML = "<option value=''>Selecciona un profesor primero</option>";
      document.getElementById("contenido-asistencia").innerHTML = "<p style='color:var(--tinta-suave);'>Selecciona un profesor para ver sus clases.</p>";
      return;
    }
    const q = query(collection(db, "clases"), where("docenteCorreo", "==", correoActivo));
    const snap = await getDocs(q);
    const clases = snap.docs.map((d) => ({ id: d.id, ...d.data() }));

    const porClave = {};
    clases.forEach((c) => {
      const clave = claveDeGrupo(c);
      if (!porClave[clave]) porClave[clave] = [];
      porClave[clave].push(c);
    });

    gruposClase = Object.entries(porClave).map(([key, clasesGrupo]) => {
      clasesGrupo.sort((a, b) => (a.id < b.id ? -1 : 1));
      const primera = clasesGrupo[0];
      const sedes = clasesGrupo.map((c) => c.ciudadNombre).join(", ");
      return {
        key,
        claseAncla: clasesGrupo[0].id,
        esDistancia: (primera.programaNombre || "").toLowerCase().includes("distancia"),
        etiqueta: `${primera.programaNombre ? primera.programaNombre + " · " : ""}${primera.nivel} - ${primera.grupo} (${sedes}) — ${primera.anio}-${primera.periodo} Ciclo ${primera.ciclo}`,
        clases: clasesGrupo
      };
    });

    const select = document.getElementById("selector-clase");
    select.innerHTML = "";
    if (gruposClase.length === 0) {
      select.innerHTML = "<option value=''>No tienes clases asignadas</option>";
      document.getElementById("contenido-asistencia").innerHTML = "";
      document.getElementById("panel-estudiantes").innerHTML = "";
      return;
    }
    if (gruposClase.length > 1) {
      const ph = document.createElement("option");
      ph.value = ""; ph.textContent = "Selecciona la clase...";
      select.appendChild(ph);
    }
    gruposClase.forEach((g) => {
      const opt = document.createElement("option");
      opt.value = g.key;
      opt.textContent = g.etiqueta;
      select.appendChild(opt);
    });

    const params = new URLSearchParams(window.location.search);
    const grupoDesdeUrl = params.get("grupo");
    const claveInicial = (grupoDesdeUrl && gruposClase.some((g) => g.key === grupoDesdeUrl)) ? grupoDesdeUrl : (gruposClase.length === 1 ? gruposClase[0].key : "");
    select.value = claveInicial;
    if (!claveInicial) {
      document.getElementById("contenido-asistencia").innerHTML = "<p style='color:var(--tinta-suave);'>Selecciona una clase.</p>";
      document.getElementById("panel-estudiantes").innerHTML = "";
      return;
    }

    await cargarCalendario(claveInicial);
  }

  document.getElementById("selector-clase").addEventListener("change", (e) => {
    if (e.target.value) cargarCalendario(e.target.value);
    else {
      document.getElementById("contenido-asistencia").innerHTML = "<p style='color:var(--tinta-suave);'>Selecciona una clase.</p>";
      document.getElementById("panel-estudiantes").innerHTML = "";
    }
  });

  let fechasSesion = []; // [{fecha: Date, horario: {...}, bloqueMin, numBloques}]
  let fechaActivaTexto = null;
  let estudiantesActuales = [];
  let estudiantesMovidos = [];
  let sesionesGuardadas = {};
  let grupoActual = null;

  function formatoFecha(d) { return d.toISOString().slice(0, 10); }

  function minutosEntre(horaInicio, horaFin) {
    const [h1, m1] = horaInicio.split(":").map(Number);
    const [h2, m2] = horaFin.split(":").map(Number);
    return (h2 * 60 + m2) - (h1 * 60 + m1);
  }

  async function cargarCalendario(claveGrupo) {
    grupoActual = gruposClase.find((g) => g.key === claveGrupo);
    const contenedor = document.getElementById("contenido-asistencia");
    contenedor.innerHTML = "<p style='color:var(--tinta-suave);'>Cargando...</p>";

    try {
      const primera = grupoActual.clases[0];
      try {
        const sp = primera.programaId ? await getDoc(doc(db, "programas", primera.programaId)) : null;
        grupoActual.umbrales = sp && sp.exists() ? calcularUmbrales(sp.data(), primera.nivel) : null;
      } catch (e) { grupoActual.umbrales = null; }
      const idPeriodo = `${primera.anio}-${primera.periodo}-${primera.ciclo}`;
      const snapPeriodo = await getDoc(doc(db, "periodos", idPeriodo));

      if (!snapPeriodo.exists() || !snapPeriodo.data().fechaInicio || !snapPeriodo.data().fechaFin) {
        contenedor.innerHTML = `<p style="color:var(--error);">El período ${idPeriodo} todavía no tiene fecha de inicio/fin configurada. Pide que la agreguen en "Períodos académicos".</p>`;
        return;
      }
      const per = snapPeriodo.data();
      const inicioPeriodo = new Date(per.fechaInicio + "T00:00:00");
      const fin = new Date(per.fechaFin + "T00:00:00");

      // Cada clase empieza en su propia fecha (la fija el profesor o coordinación).
      // Mientras no exista, NO se muestra calendario: así nunca salen fechas de
      // antes de que la clase realmente empezara.
      const fechaInicioClase = primera.fechaInicioClase || null;
      const inicioClase = fechaInicioClase ? new Date(fechaInicioClase + "T00:00:00") : null;
      const inicio = inicioClase && inicioClase > inicioPeriodo ? inicioClase : inicioPeriodo;

      const bloqueMin = grupoActual.esDistancia ? 60 : 45;
      const horarios = primera.horarios || [];

      fechasSesion = [];
      if (fechaInicioClase) {
        for (let d = new Date(inicio); d <= fin; d.setDate(d.getDate() + 1)) {
          const horario = horarios.find((h) => DIAS_SEMANA[h.dia] === d.getDay());
          if (!horario) continue;
          const duracion = minutosEntre(horario.horaInicio, horario.horaFin);
          const numBloques = Math.max(1, Math.round(duracion / bloqueMin));
          fechasSesion.push({ fecha: new Date(d), horario, numBloques, bloqueMin });
        }
      }

      const snapSesiones = await getDocs(collection(db, "clases", grupoActual.claseAncla, "sesiones"));
      sesionesGuardadas = {};
      snapSesiones.forEach((d) => { sesionesGuardadas[d.id] = d.data(); });

      let estudiantes = await cargarEstudiantesDeClases(grupoActual.clases, rol, perfil);
      estudiantes.sort((a, b) => (a.apellido || "").localeCompare(b.apellido || ""));
      const separados = separarMovidos(estudiantes);
      estudiantesActuales = separados.activos;
      estudiantesMovidos = separados.movidos;

      const panel = document.getElementById("panel-estudiantes");
      if (rol === "profesor") {
        montarPanelProfesor(panel, {
          grupo: grupoActual, usuario, perfil,
          getEstudiantes: () => estudiantesActuales,
          getMovidos: () => estudiantesMovidos,
          alCambiar: () => cargarCalendario(claveGrupo)
        });
      } else {
        panel.innerHTML = "";
      }

      if (!fechaInicioClase) {
        pintarSinFechaInicio();
      } else {
        pintarFechas();
        pintarResumenAsistencia();
      }
    } catch (error) {
      console.error("Error cargando asistencia:", error);
      contenedor.innerHTML = `<p style="color:var(--error);">No se pudo cargar (${error.code || error.message}).</p>`;
    }
  }

  // Control "Esta clase empezó el: [fecha]". Lo pueden usar el profesor, coordinación
  // y Master (Admin, una vez desbloquea la edición).
  function crearControlFechaInicio(obligatorio) {
    const ancla = grupoActual.clases[0];
    const caja = document.createElement("div");
    caja.style.cssText = "display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px; padding:10px 14px; border:1px solid var(--linea); border-radius:10px; background:var(--superficie); max-width:760px;";
    caja.innerHTML = `
      <label style="font-size:13.5px; font-weight:600;">${obligatorio ? "¿Cuándo empezó esta clase?" : "Esta clase empezó el:"}</label>
      <input type="date" id="input-fecha-inicio-clase" value="${ancla.fechaInicioClase || ""}" ${edicionDesbloqueada ? "" : "disabled"} style="font-size:13px; padding:7px 9px; border:1px solid var(--linea); border-radius:6px;">
      <button type="button" class="boton-secundario" id="boton-fecha-inicio-clase" style="${edicionDesbloqueada ? "" : "display:none;"}">${obligatorio ? "Guardar y ver calendario" : "Cambiar fecha"}</button>
      <span id="aviso-fecha-inicio" style="font-size:12.5px;"></span>`;
    caja.querySelector("#boton-fecha-inicio-clase").addEventListener("click", async () => {
      const valor = caja.querySelector("#input-fecha-inicio-clase").value;
      const aviso = caja.querySelector("#aviso-fecha-inicio");
      if (!valor) { aviso.style.color = "var(--error)"; aviso.textContent = "Elige una fecha."; return; }
      try {
        await updateDoc(doc(db, "clases", ancla.id), { fechaInicioClase: valor });
        ancla.fechaInicioClase = valor;
        await registrarLog(usuario, rol, "Fijó fecha de inicio de clase", `${grupoActual.etiqueta} → ${valor}`);
        fechaActivaTexto = null;
        await cargarCalendario(grupoActual.key);
      } catch (error) {
        aviso.style.color = "var(--error)";
        aviso.textContent = error.code === "permission-denied"
          ? "No se pudo guardar: el período de esta clase está cerrado o no tienes permiso."
          : `No se pudo guardar (${error.code || error.message}).`;
      }
    });
    return caja;
  }

  function pintarSinFechaInicio() {
    const contenedor = document.getElementById("contenido-asistencia");
    contenedor.innerHTML = "";
    const p = document.createElement("p");
    p.style.cssText = "color:var(--tinta-suave); max-width:620px; font-size:13.5px;";
    p.textContent = edicionDesbloqueada
      ? "Esta clase todavía no tiene fecha de inicio. Indícala para que el calendario de asistencia empiece a contar desde ese día."
      : "Esta clase todavía no tiene fecha de inicio. Pídele al profesor o a coordinación que la indique.";
    contenedor.appendChild(p);
    contenedor.appendChild(crearControlFechaInicio(true));
  }

  function pintarFechas() {
    const contenedor = document.getElementById("contenido-asistencia");
    contenedor.innerHTML = "";
    contenedor.appendChild(crearControlFechaInicio(false));

    if (fechasSesion.length === 0) {
      contenedor.insertAdjacentHTML("beforeend", "<p style='color:var(--tinta-suave);'>No hay sesiones calculadas — revisa que la clase tenga horarios y que la fecha de inicio caiga antes del fin del período.</p>");
      return;
    }

    const lista = document.createElement("div");
    lista.className = "lista-fechas";
    fechasSesion.forEach((s) => {
      const fechaTexto = formatoFecha(s.fecha);
      const guardada = sesionesGuardadas[fechaTexto];
      const btn = document.createElement("button");
      btn.className = "pastilla-fecha" +
        (fechaTexto === fechaActivaTexto ? " activa" : "") +
        (guardada?.festivo ? " es-festivo" : "") +
        (guardada?.speaking && !guardada?.festivo ? " es-speaking" : "");
      if (guardada?.tema) btn.title = guardada.tema;
      btn.innerHTML = `<span class="dia-semana">${DIAS_CORTOS[s.fecha.getDay()]}</span>${s.fecha.getDate()}/${s.fecha.getMonth() + 1}${guardada?.speaking && !guardada?.festivo ? '<span class="etiqueta-speaking">🎤 Speaking</span>' : ""}`;
      btn.addEventListener("click", () => {
        fechaActivaTexto = fechaTexto;
        pintarFechas();
        pintarDia();
      });
      lista.appendChild(btn);
    });
    contenedor.appendChild(lista);

    const filaExtra = document.createElement("div");
    filaExtra.style.cssText = "display:flex; gap:8px; align-items:center; margin-bottom:18px; flex-wrap: wrap;";
    filaExtra.innerHTML = `
      <input type="date" id="input-fecha-extra" style="font-size:13px; padding:7px 9px; border:1px solid var(--linea); border-radius:6px;">
      <button type="button" class="boton-secundario" id="boton-agregar-fecha-extra">+ Agregar fecha (clase extra / recuperación)</button>
      <button type="button" class="boton-secundario" id="boton-ver-resumen">Ver resumen de horas de inasistencia</button>
    `;
    contenedor.appendChild(filaExtra);

    document.getElementById("boton-agregar-fecha-extra").addEventListener("click", () => {
      const valor = document.getElementById("input-fecha-extra").value;
      if (!valor) return;
      if (!fechasSesion.some((s) => formatoFecha(s.fecha) === valor)) {
        const bloqueMin = grupoActual.esDistancia ? 60 : 60; // fecha extra: bloque completo por defecto
        fechasSesion.push({ fecha: new Date(valor + "T00:00:00"), horario: null, numBloques: 1, bloqueMin });
        fechasSesion.sort((a, b) => a.fecha - b.fecha);
      }
      fechaActivaTexto = valor;
      pintarFechas();
      pintarDia();
    });

    document.getElementById("boton-ver-resumen").addEventListener("click", pintarResumenAsistencia);

    const div = document.createElement("div");
    div.id = "cuerpo-dia";
    contenedor.appendChild(div);
  }

  // Botón de guardar también arriba; el aviso del de abajo se copia aquí.
  function duplicarGuardarArriba(textoBoton, alClic, idAvisoAbajo) {
    const barra = document.createElement("div");
    barra.style.cssText = "display:flex; gap:12px; align-items:center; margin:0 0 12px; flex-wrap:wrap;";
    const b = document.createElement("button");
    b.className = "boton-primario";
    b.textContent = textoBoton;
    b.style.cssText = "width:auto; padding:10px 18px;";
    b.addEventListener("click", alClic);
    const av = document.createElement("span");
    av.style.cssText = "font-size:13px;";
    barra.appendChild(b); barra.appendChild(av);
    const abajo = document.getElementById(idAvisoAbajo);
    if (abajo) {
      const copiar = () => { av.textContent = abajo.textContent; av.style.color = abajo.style.color; };
      new MutationObserver(copiar).observe(abajo, { childList: true, characterData: true, subtree: true, attributes: true });
    }
    return barra;
  }

  function pintarDia() {
    const cuerpo = document.getElementById("cuerpo-dia");
    const sesionInfo = fechasSesion.find((s) => formatoFecha(s.fecha) === fechaActivaTexto);
    const numBloques = sesionInfo?.numBloques || 1;
    const bloqueMin = sesionInfo?.bloqueMin || 60;
    const guardada = sesionesGuardadas[fechaActivaTexto] || { festivo: false, ausencias: {} };
    const permiteSpeaking = !!grupoActual.esDistancia;

    cuerpo.innerHTML = `
      <p class="info-bloques">${numBloques} bloque(s) de ${bloqueMin} min ese día.</p>
      <label class="toggle-festivo">
        <input type="checkbox" id="chk-festivo" ${guardada.festivo ? "checked" : ""} ${edicionDesbloqueada ? "" : "disabled"}>
        Marcar este día como festivo (no hay clase / no se toma asistencia)
      </label>
      ${permiteSpeaking ? `<label class="toggle-festivo">
        <input type="checkbox" id="chk-speaking" ${guardada.speaking ? "checked" : ""} ${edicionDesbloqueada ? "" : "disabled"}>
        🎤 Esta es una Speaking session (marca quién la realizó)
      </label>` : ""}
      <div id="caja-tema" style="margin:10px 0;">
        <label for="input-tema" id="label-tema" style="display:block; font-size:13px; font-weight:500; color:var(--tinta-suave); margin-bottom:4px;"></label>
        <input type="text" id="input-tema" maxlength="300" value="" ${edicionDesbloqueada ? "" : "disabled"} placeholder="Ej. Unit 3, Lesson 2, p. 24-26" style="width:100%; max-width:560px; font-family:var(--fuente-cuerpo); font-size:13.5px; padding:8px 10px; border:1px solid var(--linea); border-radius:7px; background:var(--fondo); color:var(--tinta);">
      </div>
      <div id="caja-horas" style="margin:10px 0; display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;">
        <div><label for="input-llegada" style="display:block; font-size:13px; font-weight:500; color:var(--tinta-suave); margin-bottom:4px;">Hora de llegada</label>
          <input type="time" id="input-llegada" style="font-size:13.5px; padding:7px 9px; border:1px solid var(--linea); border-radius:7px; background:var(--fondo); color:var(--tinta);"></div>
        <div><label for="input-salida" style="display:block; font-size:13px; font-weight:500; color:var(--tinta-suave); margin-bottom:4px;">Hora de salida</label>
          <input type="time" id="input-salida" style="font-size:13.5px; padding:7px 9px; border:1px solid var(--linea); border-radius:7px; background:var(--fondo); color:var(--tinta);"></div>
        <div id="estado-vobo" style="font-size:13px;"></div>
      </div>
      <div style="margin:10px 0;">
        <label for="input-observaciones" style="display:block; font-size:13px; font-weight:500; color:var(--tinta-suave); margin-bottom:4px;">Observaciones (opcional)</label>
        <textarea id="input-observaciones" rows="2" maxlength="500" placeholder="Algo que quieras dejar anotado de esta clase..." style="width:100%; max-width:560px; font-family:var(--fuente-cuerpo); font-size:13.5px; padding:8px 10px; border:1px solid var(--linea); border-radius:7px; background:var(--fondo); color:var(--tinta);"></textarea>
      </div>
      <div id="zona-estudiantes"></div>
    `;
    const inputTema = document.getElementById("input-tema");
    inputTema.value = guardada.tema || "";
    const inputObs = document.getElementById("input-observaciones");
    inputObs.value = guardada.observaciones || "";
    const inputLlegada = document.getElementById("input-llegada");
    const inputSalida = document.getElementById("input-salida");
    inputLlegada.value = guardada.horaLlegada || "";
    inputSalida.value = guardada.horaSalida || "";
    const esGestionVobo = ["coordinador", "secretaria", "admin", "master"].includes(rol);
    const bloqueadoPorVobo = !!guardada.vobo && rol === "profesor";
    [inputTema, inputObs, inputLlegada, inputSalida].forEach((el) => { el.disabled = !edicionDesbloqueada || bloqueadoPorVobo; });
    const labelTema = document.getElementById("label-tema");
    const refrescarLabelTema = () => {
      const esSp = !!(document.getElementById("chk-speaking")?.checked);
      labelTema.textContent = esSp ? "🎤 Tema del Speaking" : "Unit, lesson and page (tema dado en la clase)";
    };

    const chkFestivo = document.getElementById("chk-festivo");
    const chkSpeaking = document.getElementById("chk-speaking");
    const zona = document.getElementById("zona-estudiantes");

    function pintarTablaEstudiantes() {
      if (chkFestivo.checked) { zona.innerHTML = ""; return; }

      const tabla = document.createElement("table");
      tabla.className = "tabla-asistencia";
      let theadHtml = `<tr><th>No.</th><th>ID</th><th>Estudiante</th>`;
      for (let b = 1; b <= numBloques; b++) theadHtml += `<th>Bloque ${b}</th>`;
      theadHtml += `<th>Horas ausente</th>`;
      const hayColSpeaking = !!(chkSpeaking && chkSpeaking.checked);
      if (hayColSpeaking) theadHtml += `<th>🎤 Realizó Speaking</th>`;
      theadHtml += `</tr>`;
      tabla.innerHTML = `<thead>${theadHtml}</thead><tbody></tbody>`;
      const tbody = tabla.querySelector("tbody");

      estudiantesActuales.forEach((est, idx) => {
        const marcados = guardada.ausencias?.[est.cedula] || [];
        let celdas = `<td>${idx + 1}</td><td>${est.cedula}</td><td>${est.apellido} ${est.nombre}${badgeReporte(est)}</td>`;
        for (let b = 0; b < numBloques; b++) {
          celdas += `<td class="celda-bloque"><input type="checkbox" class="chk-bloque" data-cedula="${est.cedula}" data-bloque="${b}" ${marcados[b] ? "checked" : ""} ${edicionDesbloqueada ? "" : "disabled"}></td>`;
        }
        celdas += `<td class="col-horas" id="horas-${est.cedula}">${((marcados.filter(Boolean).length) * bloqueMin / 60).toFixed(2)}</td>`;
        if (hayColSpeaking) {
          celdas += `<td class="celda-bloque"><input type="checkbox" class="chk-speaking-realizada" data-cedula="${est.cedula}" ${guardada.speakingRealizada?.[est.cedula] ? "checked" : ""} ${edicionDesbloqueada ? "" : "disabled"}></td>`;
        }
        const fila = document.createElement("tr");
        fila.innerHTML = celdas;
        tbody.appendChild(fila);
      });

      zona.innerHTML = "";
      zona.appendChild(tabla);

      tabla.querySelectorAll(".chk-speaking-realizada").forEach((chk) => {
        chk.addEventListener("change", () => {
          if (!guardada.speakingRealizada) guardada.speakingRealizada = {};
          guardada.speakingRealizada[chk.dataset.cedula] = chk.checked;
        });
      });

      tabla.querySelectorAll(".chk-bloque").forEach((chk) => {
        chk.addEventListener("change", () => {
          const cedula = chk.dataset.cedula;
          const b = Number(chk.dataset.bloque);
          if (!guardada.ausencias) guardada.ausencias = {};
          if (!guardada.ausencias[cedula]) guardada.ausencias[cedula] = new Array(numBloques).fill(false);
          guardada.ausencias[cedula][b] = chk.checked;
          const totalHoras = guardada.ausencias[cedula].filter(Boolean).length * bloqueMin / 60;
          document.getElementById(`horas-${cedula}`).textContent = totalHoras.toFixed(2);
        });
      });
    }

    chkFestivo.addEventListener("change", pintarTablaEstudiantes);
    refrescarLabelTema();
    if (chkSpeaking) chkSpeaking.addEventListener("change", () => {
      guardada.speaking = chkSpeaking.checked;
      refrescarLabelTema();
      pintarTablaEstudiantes();
    });
    pintarTablaEstudiantes();

    const botonGuardar = document.createElement("button");
    botonGuardar.className = "boton-primario";
    botonGuardar.textContent = "Guardar asistencia de este día";
    botonGuardar.style.display = edicionDesbloqueada ? "block" : "none";
    // voboNuevo: undefined = conservar el que haya; null = quitar; objeto = poner.
    async function guardar(voboNuevo) {
      const aviso = document.getElementById("aviso-asistencia");
      aviso.style.color = "";
      aviso.textContent = "Guardando...";
      const esSpeaking = !!(chkSpeaking && chkSpeaking.checked) && !chkFestivo.checked;
      const speakingRealizadas = Object.fromEntries(Object.entries(guardada.speakingRealizada || {}).filter(([, v]) => v));
      const vobo = voboNuevo === undefined ? (guardada.vobo || null) : voboNuevo;
      const datos = {
        fecha: fechaActivaTexto,
        festivo: chkFestivo.checked,
        numBloques, bloqueMin,
        ausencias: chkFestivo.checked ? {} : (guardada.ausencias || {}),
        speaking: esSpeaking,
        speakingRealizada: esSpeaking ? speakingRealizadas : {},
        tema: chkFestivo.checked ? "" : inputTema.value.trim().slice(0, 300),
        horaLlegada: chkFestivo.checked ? "" : inputLlegada.value,
        horaSalida: chkFestivo.checked ? "" : inputSalida.value,
        observaciones: inputObs.value.trim().slice(0, 500)
      };
      if (vobo) datos.vobo = vobo;
      try {
        await setDoc(doc(db, "clases", grupoActual.claseAncla, "sesiones", fechaActivaTexto), datos);
        sesionesGuardadas[fechaActivaTexto] = datos;
        await registrarLog(usuario, rol, voboNuevo ? "Dio visto bueno de asistencia docente" : (voboNuevo === null ? "Quitó visto bueno de asistencia docente" : "Guardó asistencia"), `${fechaActivaTexto} — ${grupoActual.etiqueta}`);
        pintarFechas();
        pintarDia();
        document.getElementById("aviso-asistencia").textContent = voboNuevo ? "Visto bueno registrado." : "Asistencia guardada correctamente.";
        document.getElementById("aviso-asistencia").style.color = "#2E6E4E";
      } catch (error) {
        aviso.style.color = "var(--error)";
        aviso.textContent = error.code === "permission-denied"
          ? "No se pudo guardar: este período académico ya está cerrado o no tienes permiso. Pide a Master que lo reabra si es necesario."
          : `No se pudo guardar (${error.code || error.message}).`;
      }
    }
    botonGuardar.addEventListener("click", () => guardar(undefined));
    cuerpo.appendChild(botonGuardar);
    if (edicionDesbloqueada) cuerpo.insertBefore(duplicarGuardarArriba("Guardar asistencia de este día", () => guardar(undefined), "aviso-asistencia"), cuerpo.firstChild);

    // Visto bueno de asistencia docente (solo coordinación, secretaría, admin y Master).
    const estadoVobo = document.getElementById("estado-vobo");
    if (guardada.festivo) {
      estadoVobo.textContent = "";
    } else if (guardada.vobo) {
      estadoVobo.innerHTML = `<span style="color:#2d6a58; font-weight:600;">✔ Visto bueno de ${guardada.vobo.porNombre || guardada.vobo.por}</span> <span style="color:var(--tinta-suave);">(${(guardada.vobo.fecha || "").slice(0, 10)})</span>`;
    } else {
      estadoVobo.innerHTML = `<span style="color:var(--tinta-suave);">Sin visto bueno todavía.</span>`;
    }
    if (esGestionVobo && !guardada.festivo) {
      const botonVobo = document.createElement("button");
      botonVobo.type = "button";
      botonVobo.className = "boton-secundario";
      botonVobo.style.marginLeft = "8px";
      if (guardada.vobo) {
        botonVobo.textContent = "Quitar visto bueno";
        botonVobo.addEventListener("click", () => guardar(null));
      } else {
        botonVobo.textContent = "✔ Dar visto bueno al profesor";
        botonVobo.addEventListener("click", () => {
          const aviso = document.getElementById("aviso-asistencia");
          if (!inputTema.value.trim() || !inputLlegada.value || !inputSalida.value) {
            aviso.style.color = "var(--error)";
            aviso.textContent = "Para dar el visto bueno hacen falta el tema, la hora de llegada y la hora de salida.";
            return;
          }
          guardar({ por: usuario.email, porNombre: perfil?.nombre || usuario.email, fecha: new Date().toISOString() });
        });
      }
      cuerpo.appendChild(botonVobo);
    }

    const aviso = document.createElement("p");
    aviso.className = "aviso";
    aviso.id = "aviso-asistencia";
    cuerpo.appendChild(aviso);
  }

  function pintarResumenAsistencia() {
    const cuerpo = document.getElementById("cuerpo-dia");
    if (!cuerpo) return;
    const horasTotales = {};
    estudiantesActuales.forEach((est, idx) => { horasTotales[est.cedula] = 0; });
    const speakingHechas = {};
    let totalSpeaking = 0;
    const muestraSpeaking = !!grupoActual.esDistancia;

    Object.values(sesionesGuardadas).forEach((sesion) => {
      if (sesion.festivo) return;
      if (sesion.speaking) {
        totalSpeaking++;
        Object.entries(sesion.speakingRealizada || {}).forEach(([cedula, hecho]) => {
          if (hecho) speakingHechas[cedula] = (speakingHechas[cedula] || 0) + 1;
        });
      }
      const bloqueMin = sesion.bloqueMin || 60;
      Object.entries(sesion.ausencias || {}).forEach(([cedula, marcados]) => {
        if (horasTotales[cedula] === undefined) horasTotales[cedula] = 0;
        const bloquesMarcados = (marcados || []).filter(Boolean).length;
        horasTotales[cedula] += bloquesMarcados * bloqueMin / 60;
      });
    });

    const tabla = document.createElement("table");
    tabla.className = "tabla-asistencia";
    tabla.innerHTML = `<thead><tr><th>No.</th><th>ID</th><th>Estudiante</th><th>Horas de inasistencia</th>${grupoActual.umbrales ? `<th>Estado (pierde con más de ${Math.round(grupoActual.umbrales.perdida * 100) / 100} h)</th>` : ""}${muestraSpeaking ? `<th>🎤 Speaking realizadas (de ${totalSpeaking})</th>` : ""}</tr></thead><tbody></tbody>`;
    const tbody = tabla.querySelector("tbody");

    estudiantesActuales.forEach((est, idx) => {
      const horas = horasTotales[est.cedula] || 0;
      const umb = grupoActual.umbrales;
      const estado = umb ? estadoInasistencia(horas, umb) : (horas >= 2 ? "alerta1" : "ok");
      const color = estado === "perdida" ? "#8a3a22" : (estado === "alerta2" ? "#8a4b12" : (estado === "alerta1" ? "#7a5d00" : ""));
      const alerta = estado !== "ok" ? ` style="color:${color}; font-weight:600;"` : "";
      const fila = document.createElement("tr");
      fila.innerHTML = `<td>${idx + 1}</td><td>${est.cedula}</td><td>${est.apellido} ${est.nombre}${badgeReporte(est)}</td><td${alerta}>${horas.toFixed(2)}${estado !== "ok" ? " ⚠" : ""}</td>${umb ? `<td${alerta}>${ETIQUETA_ESTADO[estado]}</td>` : ""}${muestraSpeaking ? `<td>${speakingHechas[est.cedula] || 0}</td>` : ""}`;
      tbody.appendChild(fila);
    });

    // Estudiantes movidos a otra clase: historial de solo lectura.
    estudiantesMovidos.forEach((est) => {
      const horas = horasTotales[est.cedula] || 0;
      const fila = document.createElement("tr");
      fila.style.cssText = "opacity:0.55;";
      fila.innerHTML = `<td>—</td><td>${est.cedula}</td><td>${est.apellido} ${est.nombre} <span style="font-size:11px;">(movido a ${est.movidoATexto || "otra clase"})</span></td><td>${horas.toFixed(2)}</td>${grupoActual.umbrales ? "<td></td>" : ""}${muestraSpeaking ? `<td>${speakingHechas[est.cedula] || 0}</td>` : ""}`;
      tbody.appendChild(fila);
    });

    cuerpo.innerHTML = "";
    cuerpo.appendChild(tabla);
  }

  await cargarGrupos();
</script>
</body>
</html>
