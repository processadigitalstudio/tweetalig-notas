<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweetalig — Panel</title>
<link rel="stylesheet" href="../css/styles.css?v=2">
<style>
  .tabla-simple { width: 100%; border-collapse: collapse; max-width: 900px; margin-top: 24px; }
  .tabla-simple th, .tabla-simple td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--linea); font-size: 14px; }
  .tabla-simple th { color: var(--tinta-suave); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  .bloque-periodo { margin-top: 28px; }
  .bloque-periodo h3 { font-family: var(--fuente-display); font-size: 17px; color: var(--azul-profundo); margin: 0 0 4px; }
  .bloque-periodo p.rango { font-size: 12px; color: var(--tinta-suave); margin: 0; }
</style>
</head>
<body>

<div class="app-shell">
  <nav class="app-nav">
    <div class="logo-nav-wrap"><img src="../assets/logo-tweetalig.png" alt="Tweetalig"></div>
    <h1>Portal de notas</h1>
    <div id="menu-rol"></div>
    <a href="#" id="link-salir">Cerrar sesión</a>
  </nav>

  <main class="app-contenido">
    <span class="etiqueta-rol" id="etiqueta-rol"></span>
    <h2 id="titulo-bienvenida">Cargando...</h2>
    <p id="texto-bienvenida"></p>

    <div id="contenedor-periodos"></div>
  </main>
</div>

<script type="module">
  import { requireAuth } from "../js/auth.js?v=3";
  import { leerClases } from "../js/clases-lectura.js?v=1";
  import { claveGrupo as claveDeGrupo } from "../js/grupos.js?v=2";
  import { periodosCerrados, pintarTarjetas } from "../js/tarjetas-clases.js?v=1";
  import { db } from "../js/firebase-config.js?v=3";
  import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const NOMBRE_ROL = {
    master: "Master",
    admin: "Admin",
    coordinador: "Coordinador académico",
    secretaria: "Secretaria académica",
    coordinador_examenes: "Coordinador de exámenes",
    profesor: "Profesor"
  };

  const { usuario, rol, perfil } = await requireAuth();

  document.getElementById("etiqueta-rol").textContent = NOMBRE_ROL[rol] || rol;
  document.getElementById("titulo-bienvenida").textContent = `Hola, ${perfil.nombre || usuario.email}`;
  document.getElementById("texto-bienvenida").textContent = "Elige una opción del menú para comenzar.";

  // Solo tiene sentido mostrar esto a roles de gestión (no al profesor, que
  // tiene su propia vista de "mis clases" cuando construyamos esa pantalla).
  if (["master", "admin", "coordinador", "secretaria"].includes(rol)) {
    const contenedor = document.getElementById("contenedor-periodos");

    // Aviso de reportes de profesores pendientes (no bloquea el resto del panel).
    try {
      const sedesAviso = perfil?.ciudadIds || (perfil?.ciudadId ? [perfil.ciudadId] : []);
      const esCoord = (rol === "coordinador" || rol === "secretaria");
      if (!esCoord || sedesAviso.length > 0) {
        const consultas = esCoord
          ? [
              query(collection(db, "reportes_estudiantes"), where("ciudadId", "in", sedesAviso), where("estado", "==", "pendiente")),
              query(collection(db, "reportes_estudiantes"), where("ciudadOrigenId", "in", sedesAviso), where("estado", "==", "pendiente"))
            ]
          : [query(collection(db, "reportes_estudiantes"), where("estado", "==", "pendiente"))];
        const snapsRep = await Promise.all(consultas.map((c) => getDocs(c)));
        const idsRep = new Set();
        snapsRep.forEach((sn) => sn.docs.forEach((d) => idsRep.add(d.id)));
        const snapRep = { empty: idsRep.size === 0, size: idsRep.size };
        if (!snapRep.empty) {
          const aviso = document.createElement("a");
          aviso.href = "reportes.html";
          aviso.style.cssText = "display:block; max-width:640px; margin:18px 0 6px; padding:12px 16px; border-radius:10px; background:#fbf0c9; border:1px solid #e6c14f; color:#5c4700; text-decoration:none; font-size:14px; font-weight:500;";
          aviso.textContent = `🔔 Tienes ${snapRep.size} reporte(s) de profesores pendiente(s). Haz clic para revisarlos.`;
          contenedor.before(aviso);
        }
      }
    } catch (e) { console.warn("No se pudieron leer los reportes pendientes:", e); }

    const snapPeriodos = await getDocs(query(collection(db, "periodos"), where("activo", "==", true)));

    if (snapPeriodos.empty) {
      contenedor.innerHTML = "<p style='color: var(--tinta-suave); margin-top: 24px;'>No hay períodos marcados como activos todavía. Ve a \"Períodos académicos\" para crear/activar uno.</p>";
    } else {
      // Pedir las clases de todos los períodos activos AL MISMO TIEMPO,
      // en vez de uno por uno, y luego armar los bloques en orden.
      const bloques = await Promise.all(snapPeriodos.docs.map(async (dPeriodo) => {
        const per = dPeriodo.data();
        const snapClases = await leerClases(db, rol, perfil, [
          where("anio", "==", per.anio),
          where("periodo", "==", per.periodo),
          where("ciclo", "==", per.ciclo)
        ]);

        const bloque = document.createElement("div");
        bloque.className = "bloque-periodo";
        bloque.innerHTML = `
          <h3>${per.anio}-${per.periodo} / Ciclo ${per.ciclo}</h3>
          <p class="rango">${per.fechaInicio || "sin fecha de inicio"} → ${per.fechaFin || "sin fecha de fin"} · ${snapClases.size} clase(s) activa(s)</p>
        `;

        if (!snapClases.empty) {
          const tabla = document.createElement("table");
          tabla.className = "tabla-simple";
          tabla.innerHTML = `
            <thead><tr><th>Nivel</th><th>Grupo</th><th>Profesor</th><th>Horarios</th><th>Sede</th><th>Programa</th></tr></thead>
            <tbody></tbody>
          `;
          const cuerpo = tabla.querySelector("tbody");
          snapClases.forEach((d) => {
            const c = d.data();
            const horariosTexto = (c.horarios || []).map((h) => `${h.dia} ${h.horaInicio}-${h.horaFin}`).join(", ") || "—";
            const fila = document.createElement("tr");
            fila.innerHTML = `<td>${c.nivel}</td><td>${c.grupo}</td><td>${c.docenteNombre || "—"}</td><td>${horariosTexto}</td><td>${c.ciudadNombre || "—"}</td><td>${c.programaNombre || "—"}</td>`;
            cuerpo.appendChild(fila);
          });
          bloque.appendChild(tabla);
        }

        return bloque;
      }));

      bloques.forEach((bloque) => contenedor.appendChild(bloque));
    }
  } else if (rol === "coordinador_examenes") {
    // Próximos exámenes de sus sedes (los 10 más cercanos).
    const contenedor = document.getElementById("contenedor-periodos");
    const sedesEx = perfil?.ciudadIds || (perfil?.ciudadId ? [perfil.ciudadId] : []);
    if (!sedesEx.length) {
      contenedor.innerHTML = "<p style='color: var(--error); margin-top: 24px;'>Tu cuenta no tiene sede asignada. Pide a Master/Admin que te asigne una.</p>";
    } else {
      const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      const hoy = d.toISOString().slice(0, 10);
      const snapEx = await getDocs(query(collection(db, "examenes"), where("ciudadIds", "array-contains-any", sedesEx.slice(0, 10))));
      const proximos = snapEx.docs.map((x) => x.data())
        .filter((x) => x.estado === "programado" && x.fecha >= hoy)
        .sort((a, b) => `${a.fecha} ${a.horaInicio}`.localeCompare(`${b.fecha} ${b.horaInicio}`)).slice(0, 10);
      const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      contenedor.innerHTML = `<div class="bloque-periodo"><h3>Próximos exámenes</h3>
        <p class="rango">${proximos.length ? `${proximos.length} programado(s)` : "No hay exámenes programados."} · <a href="examenes.html">Ir a Exámenes</a></p></div>`;
      if (proximos.length) {
        const tabla = document.createElement("table");
        tabla.className = "tabla-simple";
        tabla.innerHTML = `<thead><tr><th>Fecha</th><th>Hora</th><th>Tipo</th><th>Examen</th><th>Modalidad</th><th>Citados</th></tr></thead><tbody>${
          proximos.map((x) => `<tr><td>${esc(x.fecha)}</td><td>${esc(x.horaInicio)}–${esc(x.horaFin)}</td><td>${x.tipo === "final" ? "Final" : "Simulacro"}</td><td>${esc(x.titulo)}</td><td>${x.modalidad === "presencial" ? `Presencial · ${esc(x.salon)}` : `Virtual · ${esc(x.plataforma)}`}</td><td>${x.totalCitados ?? 0}</td></tr>`).join("")
        }</tbody>`;
        contenedor.appendChild(tabla);
      }
    }
  } else if (rol === "profesor") {
    const contenedor = document.getElementById("contenedor-periodos");
    const q = query(collection(db, "clases"), where("docenteCorreo", "==", usuario.email.toLowerCase()));
    const snapMisClases = await getDocs(q);

    if (snapMisClases.empty) {
      contenedor.innerHTML = "<p style='color: var(--tinta-suave); margin-top: 24px;'>Todavía no tienes clases asignadas.</p>";
    } else {
      const porClave = {};
      snapMisClases.forEach((d) => {
        const c = { id: d.id, ...d.data() };
        const k = claveDeGrupo(c);
        (porClave[k] = porClave[k] || []).push(c);
      });
      const grupos = Object.entries(porClave).map(([key, clases]) => ({ key, clases: clases.sort((x, y) => (x.id < y.id ? -1 : 1)) }))
        .sort((g1, g2) => (g1.clases[0].nivel || "").localeCompare(g2.clases[0].nivel || "", "es", { numeric: true }) || (g1.clases[0].grupo || "").localeCompare(g2.clases[0].grupo || ""));
      const cerrados = await periodosCerrados(db);
      const cont = document.createElement("div");
      cont.style.marginTop = "24px";
      contenedor.appendChild(cont);
      pintarTarjetas(cont, grupos, {
        cerrados,
        enlaces: [
          { texto: "Asistencia", href: (g) => `asistencia.html?grupo=${encodeURIComponent(g.key)}` },
          { texto: "Notas", href: (g) => `notas.html?grupo=${encodeURIComponent(g.key)}` }
        ]
      });
    }
  }
</script>
</body>
</html>
