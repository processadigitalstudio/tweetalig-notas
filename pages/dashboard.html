<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweetalig — Panel</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="app-shell">
  <nav class="app-nav">
    <div class="logo-nav-wrap"><img src="../assets/logo-tweetalig.png" alt="Tweetalig"></div>
    <h1>Portal de notas</h1>
    <div id="menu-rol"></div>
    <a href="#" id="link-salir">Cerrar sesión</a>
  </nav>

  <main class="app-contenido">
    <span class="etiqueta-rol" id="etiqueta-rol"></span>
    <h2 id="titulo-bienvenida">Cargando...</h2>
    <p id="texto-bienvenida"></p>
  </main>
</div>

<script type="module">
  import { requireAuth, cerrarSesion } from "../js/auth.js";

  const NOMBRE_ROL = {
    master: "Master",
    coordinador: "Coordinador académico",
    secretaria: "Secretaria académica",
    profesor: "Profesor"
  };

  // Qué ve cada rol en el menú lateral. Todavía son enlaces placeholder —
  // los vamos activando a medida que construimos cada página.
  const MENU_POR_ROL = {
    master: [
      ["Sedes", "ciudades.html"],
      ["Profesores", "profesores.html"],
      ["Clases", "clases.html"],
      ["Estudiantes", "estudiantes.html"],
      ["Configuración de notas", "configuracion-notas.html"],
      ["Accesos y usuarios", "usuarios.html"]
    ],
    coordinador: [
      ["Profesores", "profesores.html"],
      ["Clases", "clases.html"],
      ["Estudiantes", "estudiantes.html"]
    ],
    secretaria: [
      ["Profesores", "profesores.html"],
      ["Clases", "clases.html"],
      ["Estudiantes", "estudiantes.html"]
    ],
    profesor: [
      ["Notas", "notas.html"],
      ["Asistencia", "asistencia.html"]
    ]
  };

  const { usuario, rol, perfil } = await requireAuth();

  document.getElementById("etiqueta-rol").textContent = NOMBRE_ROL[rol] || rol;
  document.getElementById("titulo-bienvenida").textContent = `Hola, ${perfil.nombre || usuario.email}`;
  document.getElementById("texto-bienvenida").textContent = "Elige una opción del menú para comenzar.";

  const menuEl = document.getElementById("menu-rol");
  (MENU_POR_ROL[rol] || []).forEach(([etiqueta, href]) => {
    const a = document.createElement("a");
    a.href = href;
    a.textContent = etiqueta;
    menuEl.appendChild(a);
  });

  document.getElementById("link-salir").addEventListener("click", (e) => {
    e.preventDefault();
    cerrarSesion();
  });
</script>
</body>
</html>
