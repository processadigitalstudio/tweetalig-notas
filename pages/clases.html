<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweetalig — Clases</title>
<link rel="stylesheet" href="../css/styles.css?v=2">
<style>
  .tabla-simple { width: 100%; border-collapse: collapse; max-width: 900px; margin-bottom: 28px; }
  .tabla-simple th, .tabla-simple td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--linea); font-size: 14px; }
  .tabla-simple th { color: var(--tinta-suave); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  .form-tarjeta { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); padding: 24px 28px; max-width: 520px; }
  .form-tarjeta label { display: block; font-size: 13px; font-weight: 500; color: var(--tinta-suave); margin-top: 12px; margin-bottom: 4px; }
  .form-tarjeta input, .form-tarjeta select { width: 100%; font-family: var(--fuente-cuerpo); font-size: 14px; padding: 9px 11px; border: 1px solid var(--linea); border-radius: 7px; background: var(--fondo); color: var(--tinta); }
  .fila-doble { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .fila-triple { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 6px; }
  .boton-primario { max-width: 200px; margin-top: 18px; }
  .aviso { font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="app-nav">
    <div class="logo-nav-wrap"><img src="../assets/logo-tweetalig.png" alt="Tweetalig"></div>
    <h1>Portal de notas</h1>
    <div id="menu-rol"></div>
    <a href="#" id="link-salir">Cerrar sesión</a>
  </nav>
  <main class="app-contenido">
    <span class="etiqueta-rol">Clases</span>
    <h2>Clases activas</h2>
    <p style="color: var(--tinta-suave); max-width: 600px; margin-top: -8px;">
      Una clase es la combinación de nivel + grupo + profesor + horario + sede. Los estudiantes se matriculan a una clase existente al subir el CSV.
    </p>

    <table class="tabla-simple">
      <thead><tr><th>Período</th><th>Nivel</th><th>Grupo</th><th>Profesor</th><th>Horarios</th><th>Sede</th><th>Programa</th><th></th></tr></thead>
      <tbody id="lista-clases"></tbody>
    </table>

    <div class="form-tarjeta">
      <h3 style="font-family: var(--fuente-display); color: var(--azul-profundo); margin: 0;">Crear clase</h3>

      <label style="margin-top: 0;">Período académico</label>
      <div class="fila-triple">
        <div>
          <label for="anio" style="font-size:12px;">Año</label>
          <select id="anio"></select>
        </div>
        <div>
          <label for="periodo" style="font-size:12px;">Periodo</label>
          <select id="periodo">
            <option value="1">1</option>
            <option value="2">2</option>
          </select>
        </div>
        <div>
          <label for="ciclo" style="font-size:12px;">Ciclo</label>
          <select id="ciclo"></select>
        </div>
      </div>

      <div class="fila-doble">
        <div>
          <label for="nivel">Nivel</label>
          <input type="text" id="nivel" placeholder="A1, B1.1, DELF B2...">
        </div>
        <div>
          <label for="grupo">Grupo</label>
          <input type="text" id="grupo" placeholder="A, B, Nocturno...">
        </div>
      </div>

      <label for="docente">Profesor</label>
      <select id="docente"></select>

      <label style="margin-top:0;">Horarios de esta clase</label>
      <div id="lista-horarios"></div>
      <button type="button" class="boton-secundario" id="boton-agregar-horario">+ Agregar horario</button>

      <label for="ciudad">Sede</label>
      <select id="ciudad"></select>

      <label for="programa">Programa</label>
      <select id="programa"></select>

      <button id="boton-guardar" class="boton-primario">Crear clase</button>
      <p class="aviso" id="aviso"></p>
    </div>
  </main>
</div>

<style>
  .fila-horario { display: grid; grid-template-columns: 1fr 1fr 1fr 32px; gap: 8px; margin-bottom: 8px; align-items: center; }
  .fila-horario select, .fila-horario input { width: 100%; font-family: var(--fuente-cuerpo); font-size: 13px; padding: 8px 9px; border: 1px solid var(--linea); border-radius: 6px; background: var(--fondo); color: var(--tinta); }
  .boton-quitar-horario { background: none; border: none; color: var(--error); cursor: pointer; font-size: 15px; }
  .boton-secundario { font-family: var(--fuente-cuerpo); font-size: 13px; font-weight: 500; color: var(--azul-profundo); background: none; border: 1px dashed var(--azul-profundo); border-radius: 6px; padding: 7px 12px; cursor: pointer; margin: 6px 0 14px; }
</style>

<script type="module">
  import { requireAuth, registrarLog } from "../js/auth.js?v=3";
  import { db } from "../js/firebase-config.js?v=3";
  import { collection, addDoc, updateDoc, doc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const { usuario, rol, perfil } = await requireAuth(["master", "admin", "coordinador", "secretaria"]);

  async function cargarSedes() {
    const select = document.getElementById("ciudad");
    select.innerHTML = "";
    const snap = await getDocs(collection(db, "ciudades"));
    if (snap.empty) {
      select.innerHTML = "<option value=''>Registra una sede primero</option>";
      return;
    }
    snap.forEach((d) => {
      const opt = document.createElement("option");
      opt.value = d.id;
      opt.textContent = d.data().nombre;
      select.appendChild(opt);
    });
  }

  function agregarFilaHorario(datos = null) {
    const cont = document.getElementById("lista-horarios");
    const fila = document.createElement("div");
    fila.className = "fila-horario";
    fila.innerHTML = `
      <select class="input-dia-horario">
        <option>Lunes</option><option>Martes</option><option>Miércoles</option>
        <option>Jueves</option><option>Viernes</option><option>Sábado</option>
      </select>
      <input type="time" class="input-inicio-horario" value="${datos?.horaInicio || ""}">
      <input type="time" class="input-fin-horario" value="${datos?.horaFin || ""}">
      <button type="button" class="boton-quitar-horario" title="Quitar">✕</button>
    `;
    if (datos?.dia) fila.querySelector(".input-dia-horario").value = datos.dia;
    fila.querySelector(".boton-quitar-horario").addEventListener("click", () => fila.remove());
    cont.appendChild(fila);
  }

  function leerHorarios() {
    return [...document.querySelectorAll(".fila-horario")].map((fila) => ({
      dia: fila.querySelector(".input-dia-horario").value,
      horaInicio: fila.querySelector(".input-inicio-horario").value,
      horaFin: fila.querySelector(".input-fin-horario").value
    }));
  }

  function textoHorarios(horarios) {
    if (!horarios || horarios.length === 0) return "—";
    return horarios.map((h) => `${h.dia} ${h.horaInicio}-${h.horaFin}`).join(", ");
  }

  document.getElementById("boton-agregar-horario").addEventListener("click", () => agregarFilaHorario());

  async function cargarProfesores() {
    const select = document.getElementById("docente");
    select.innerHTML = "";
    const q = query(collection(db, "usuarios"), where("rol", "==", "profesor"));
    const snap = await getDocs(q);
    listaProfesores = snap.docs.map((d) => ({ correo: d.id, nombre: d.data().nombre }));
    if (listaProfesores.length === 0) {
      select.innerHTML = "<option value=''>Registra un profesor primero</option>";
      return;
    }
    listaProfesores.forEach((p) => {
      const opt = document.createElement("option");
      opt.value = p.correo;
      opt.textContent = p.nombre;
      select.appendChild(opt);
    });
  }

  // Coordinadora/secretaria con sede asignada solo ven los programas que
  // aplican a su sede. Además, solo se muestran los programas que
  // coinciden con el año/periodo/ciclo elegido arriba para esta clase.
  async function cargarProgramas() {
    const select = document.getElementById("programa");
    select.innerHTML = "";
    const snap = await getDocs(collection(db, "programas"));
    if (snap.empty) {
      select.innerHTML = "<option value=''>Crea un programa primero</option>";
      return;
    }

    const miSede = perfil?.ciudadId;
    const restringirPorSede = (rol === "coordinador" || rol === "secretaria") && miSede;

    const anioClase = Number(document.getElementById("anio").value);
    const periodoClase = Number(document.getElementById("periodo").value);
    const cicloClase = Number(document.getElementById("ciclo").value);

    let alguno = false;
    snap.forEach((d) => {
      const p = d.data();
      const sedesPermitidas = p.sedes || [];
      const aplicaAquiTambien = sedesPermitidas.length === 0 || !restringirPorSede || sedesPermitidas.includes(miSede);
      const mismoPeriodo = p.anio === anioClase && p.periodo === periodoClase && p.ciclo === cicloClase;
      if (!aplicaAquiTambien || !mismoPeriodo) return;
      alguno = true;
      const opt = document.createElement("option");
      opt.value = d.id;
      opt.textContent = p.nombre;
      select.appendChild(opt);
    });

    if (!alguno) select.innerHTML = "<option value=''>No hay programas para ese período/sede — créalo primero</option>";
  }

  function cargarPeriodoAcademico() {
    const anioActual = new Date().getFullYear();
    const anioBase = Math.min(2026, anioActual);
    const selectAnio = document.getElementById("anio");
    selectAnio.innerHTML = "";
    for (let a = anioBase; a <= anioBase + 9; a++) {
      const opt = document.createElement("option");
      opt.value = a;
      opt.textContent = a;
      if (a === anioActual) opt.selected = true;
      selectAnio.appendChild(opt);
    }

    const selectCiclo = document.getElementById("ciclo");
    selectCiclo.innerHTML = "";
    for (let c = 1; c <= 15; c++) {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      selectCiclo.appendChild(opt);
    }
  }

  async function cargarClases() {
    const cuerpo = document.getElementById("lista-clases");
    cuerpo.innerHTML = "";
    const snap = await getDocs(collection(db, "clases"));
    snap.forEach((d) => {
      const c = d.data();
      const periodoTexto = `${c.anio || "—"}-${c.periodo || "—"} / Ciclo ${c.ciclo || "—"}`;
      const opcionesProfesor = listaProfesores.map((p) =>
        `<option value="${p.correo}" ${p.correo === c.docenteCorreo ? "selected" : ""}>${p.nombre}</option>`
      ).join("");
      const fila = document.createElement("tr");
      fila.innerHTML = `
        <td>${periodoTexto}</td><td>${c.nivel}</td><td>${c.grupo}</td>
        <td>
          <span class="nombre-docente" data-id="${d.id}">${c.docenteNombre || "—"}</span>
          <select class="select-reasignar" data-id="${d.id}" style="display:none; font-size:12px; padding:3px;">${opcionesProfesor}</select>
        </td>
        <td>${textoHorarios(c.horarios)}</td><td>${c.ciudadNombre || "—"}</td><td>${c.programaNombre || "—"}</td>
        <td><button class="btn-reasignar" data-id="${d.id}">Cambiar profesor</button></td>
      `;
      cuerpo.appendChild(fila);
    });

    cuerpo.querySelectorAll(".btn-reasignar").forEach((b) => b.addEventListener("click", async () => {
      const id = b.dataset.id;
      const span = cuerpo.querySelector(`.nombre-docente[data-id="${id}"]`);
      const select = cuerpo.querySelector(`.select-reasignar[data-id="${id}"]`);

      if (select.style.display === "none") {
        span.style.display = "none";
        select.style.display = "inline-block";
        b.textContent = "Guardar";
      } else {
        const nuevoCorreo = select.value;
        const nuevoNombre = select.options[select.selectedIndex].textContent;
        await updateDoc(doc(db, "clases", id), { docenteCorreo: nuevoCorreo, docenteNombre: nuevoNombre });
        await registrarLog(usuario, rol, "Reasignó profesor de clase", `${id} → ${nuevoNombre}`);
        cargarClases();
      }
    }));
  }

  document.getElementById("boton-guardar").addEventListener("click", async () => {
    const anio = Number(document.getElementById("anio").value);
    const periodo = Number(document.getElementById("periodo").value);
    const ciclo = Number(document.getElementById("ciclo").value);
    const nivel = document.getElementById("nivel").value.trim();
    const grupo = document.getElementById("grupo").value.trim();
    const horarios = leerHorarios();
    const selectDocente = document.getElementById("docente");
    const selectCiudad = document.getElementById("ciudad");
    const selectPrograma = document.getElementById("programa");
    const aviso = document.getElementById("aviso");

    const horariosCompletos = horarios.filter((h) => h.horaInicio && h.horaFin);

    if (!nivel || !grupo || !selectDocente.value || !selectCiudad.value || !selectPrograma.value || horariosCompletos.length === 0) {
      aviso.style.color = "var(--error)";
      aviso.textContent = "Completa todos los campos, incluyendo al menos un horario con hora de inicio y fin.";
      return;
    }

    await addDoc(collection(db, "clases"), {
      anio, periodo, ciclo,
      nivel, grupo,
      horarios: horariosCompletos,
      docenteCorreo: selectDocente.value,
      docenteNombre: selectDocente.options[selectDocente.selectedIndex].textContent,
      ciudadId: selectCiudad.value,
      ciudadNombre: selectCiudad.options[selectCiudad.selectedIndex].textContent,
      programaId: selectPrograma.value,
      programaNombre: selectPrograma.options[selectPrograma.selectedIndex].textContent,
      estudiantes: []
    });
    await registrarLog(usuario, rol, "Creó clase", `${nivel} - ${grupo} (${anio}-${periodo}, ciclo ${ciclo})`);

    aviso.style.color = "#2E6E4E";
    aviso.textContent = `Clase ${nivel} - ${grupo} creada (${anio}-${periodo}, ciclo ${ciclo}).`;
    document.getElementById("nivel").value = "";
    document.getElementById("grupo").value = "";
    document.getElementById("lista-horarios").innerHTML = "";
    agregarFilaHorario();
    cargarClases();
  });

  cargarPeriodoAcademico();
  agregarFilaHorario();
  document.getElementById("anio").addEventListener("change", cargarProgramas);
  document.getElementById("periodo").addEventListener("change", cargarProgramas);
  document.getElementById("ciclo").addEventListener("change", cargarProgramas);

  await cargarSedes();
  await cargarProfesores();
  await cargarProgramas();
  await cargarClases();
</script>
</body>
</html>
