<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweetalig — Clases</title>
<link rel="stylesheet" href="../css/styles.css?v=2">
<style>
  .tabla-simple { width: 100%; border-collapse: collapse; max-width: 900px; margin-bottom: 28px; }
  .tabla-simple th, .tabla-simple td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--linea); font-size: 14px; }
  .tabla-simple th { color: var(--tinta-suave); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  .form-tarjeta { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); padding: 24px 28px; max-width: 520px; }
  .form-tarjeta label { display: block; font-size: 13px; font-weight: 500; color: var(--tinta-suave); margin-top: 12px; margin-bottom: 4px; }
  .form-tarjeta input, .form-tarjeta select { width: 100%; font-family: var(--fuente-cuerpo); font-size: 14px; padding: 9px 11px; border: 1px solid var(--linea); border-radius: 7px; background: var(--fondo); color: var(--tinta); }
  .fila-doble { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .boton-primario { max-width: 200px; margin-top: 18px; }
  .aviso { font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="app-nav">
    <div class="logo-nav-wrap"><img src="../assets/logo-tweetalig.png" alt="Tweetalig"></div>
    <h1>Portal de notas</h1>
    <div id="menu-rol"></div>
    <a href="#" id="link-salir">Cerrar sesión</a>
  </nav>
  <main class="app-contenido">
    <span class="etiqueta-rol">Clases</span>
    <h2>Clases activas</h2>
    <p style="color: var(--tinta-suave); max-width: 600px; margin-top: -8px;">
      Una clase es la combinación de nivel + grupo + profesor + horario + sede. Los estudiantes se matriculan a una clase existente al subir el CSV.
    </p>

    <table class="tabla-simple">
      <thead><tr><th>Nivel</th><th>Grupo</th><th>Profesor</th><th>Día</th><th>Hora</th><th>Sede</th><th>Programa</th></tr></thead>
      <tbody id="lista-clases"></tbody>
    </table>

    <div class="form-tarjeta">
      <h3 style="font-family: var(--fuente-display); color: var(--azul-profundo); margin: 0;">Crear clase</h3>

      <div class="fila-doble">
        <div>
          <label for="nivel">Nivel</label>
          <input type="text" id="nivel" placeholder="A1, B1.1, DELF B2...">
        </div>
        <div>
          <label for="grupo">Grupo</label>
          <input type="text" id="grupo" placeholder="A, B, Nocturno...">
        </div>
      </div>

      <label for="docente">Profesor</label>
      <select id="docente"></select>

      <div class="fila-doble">
        <div>
          <label for="dia">Día</label>
          <select id="dia">
            <option>Lunes</option><option>Martes</option><option>Miércoles</option>
            <option>Jueves</option><option>Viernes</option><option>Sábado</option>
          </select>
        </div>
        <div>
          <label for="hora">Hora</label>
          <input type="time" id="hora">
        </div>
      </div>

      <label for="ciudad">Sede</label>
      <select id="ciudad"></select>

      <label for="programa">Programa</label>
      <select id="programa"></select>

      <button id="boton-guardar" class="boton-primario">Crear clase</button>
      <p class="aviso" id="aviso"></p>
    </div>
  </main>
</div>

<script type="module">
  import { requireAuth } from "../js/auth.js?v=3";
  import { db } from "../js/firebase-config.js?v=3";
  import { collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const { rol, perfil } = await requireAuth(["master", "coordinador", "secretaria"]);

  async function cargarSedes() {
    const select = document.getElementById("ciudad");
    select.innerHTML = "";
    const snap = await getDocs(collection(db, "ciudades"));
    if (snap.empty) {
      select.innerHTML = "<option value=''>Registra una sede primero</option>";
      return;
    }
    snap.forEach((d) => {
      const opt = document.createElement("option");
      opt.value = d.id;
      opt.textContent = d.data().nombre;
      select.appendChild(opt);
    });
  }

  async function cargarProfesores() {
    const select = document.getElementById("docente");
    select.innerHTML = "";
    const q = query(collection(db, "usuarios"), where("rol", "==", "profesor"));
    const snap = await getDocs(q);
    if (snap.empty) {
      select.innerHTML = "<option value=''>Registra un profesor primero</option>";
      return;
    }
    snap.forEach((d) => {
      const opt = document.createElement("option");
      opt.value = d.id; // correo
      opt.textContent = d.data().nombre;
      select.appendChild(opt);
    });
  }

  // Coordinadora/secretaria con sede asignada solo ven los programas que
  // aplican a su sede (o los que están marcados para "todas las sedes").
  async function cargarProgramas() {
    const select = document.getElementById("programa");
    select.innerHTML = "";
    const snap = await getDocs(collection(db, "programas"));
    if (snap.empty) {
      select.innerHTML = "<option value=''>Crea un programa primero</option>";
      return;
    }

    const miSede = perfil?.ciudadId;
    const restringirPorSede = (rol === "coordinador" || rol === "secretaria") && miSede;

    let alguno = false;
    snap.forEach((d) => {
      const p = d.data();
      const sedesPermitidas = p.sedes || [];
      const aplicaAquiTambien = sedesPermitidas.length === 0 || !restringirPorSede || sedesPermitidas.includes(miSede);
      if (!aplicaAquiTambien) return;
      alguno = true;
      const opt = document.createElement("option");
      opt.value = d.id;
      opt.textContent = p.nombre;
      select.appendChild(opt);
    });

    if (!alguno) select.innerHTML = "<option value=''>No hay programas disponibles para tu sede</option>";
  }

  async function cargarClases() {
    const cuerpo = document.getElementById("lista-clases");
    cuerpo.innerHTML = "";
    const snap = await getDocs(collection(db, "clases"));
    snap.forEach((d) => {
      const c = d.data();
      const fila = document.createElement("tr");
      fila.innerHTML = `<td>${c.nivel}</td><td>${c.grupo}</td><td>${c.docenteNombre || "—"}</td><td>${c.dia}</td><td>${c.hora}</td><td>${c.ciudadNombre || "—"}</td><td>${c.programaNombre || "—"}</td>`;
      cuerpo.appendChild(fila);
    });
  }

  document.getElementById("boton-guardar").addEventListener("click", async () => {
    const nivel = document.getElementById("nivel").value.trim();
    const grupo = document.getElementById("grupo").value.trim();
    const dia = document.getElementById("dia").value;
    const hora = document.getElementById("hora").value;
    const selectDocente = document.getElementById("docente");
    const selectCiudad = document.getElementById("ciudad");
    const selectPrograma = document.getElementById("programa");
    const aviso = document.getElementById("aviso");

    if (!nivel || !grupo || !hora || !selectDocente.value || !selectCiudad.value || !selectPrograma.value) {
      aviso.style.color = "var(--error)";
      aviso.textContent = "Completa todos los campos, incluyendo el programa.";
      return;
    }

    await addDoc(collection(db, "clases"), {
      nivel, grupo, dia, hora,
      docenteCorreo: selectDocente.value,
      docenteNombre: selectDocente.options[selectDocente.selectedIndex].textContent,
      ciudadId: selectCiudad.value,
      ciudadNombre: selectCiudad.options[selectCiudad.selectedIndex].textContent,
      programaId: selectPrograma.value,
      programaNombre: selectPrograma.options[selectPrograma.selectedIndex].textContent,
      estudiantes: []
    });

    aviso.style.color = "#2E6E4E";
    aviso.textContent = `Clase ${nivel} - ${grupo} creada.`;
    document.getElementById("nivel").value = "";
    document.getElementById("grupo").value = "";
    document.getElementById("hora").value = "";
    cargarClases();
  });

  await cargarSedes();
  await cargarProfesores();
  await cargarProgramas();
  await cargarClases();
</script>
</body>
</html>
