<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweetalig — Estudiantes</title>
<link rel="stylesheet" href="../css/styles.css?v=2">
<style>
  .tabla-simple { width: 100%; border-collapse: collapse; max-width: 900px; }
  .tabla-simple th, .tabla-simple td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--linea); font-size: 14px; }
  .tabla-simple th { color: var(--tinta-suave); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  .tabla-simple button { background: none; border: none; color: var(--error); font-size: 13px; cursor: pointer; text-decoration: underline; padding: 0; }
  .filtros { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .filtros input, .filtros select { font-family: var(--fuente-cuerpo); font-size: 13px; padding: 8px 10px; border: 1px solid var(--linea); border-radius: 7px; background: var(--fondo); color: var(--tinta); }
  .contador { font-size: 13px; color: var(--tinta-suave); margin-bottom: 14px; }
  .tabla-simple .btn-mover { color: var(--azul-profundo); margin-right: 10px; }
  .fila-movida { opacity: 0.55; }
  .fila-mover td { background: var(--superficie); }
  .fila-mover select { font-family: var(--fuente-cuerpo); font-size: 13px; padding: 6px 8px; border: 1px solid var(--linea); border-radius: 6px; max-width: 420px; }
  .fila-mover button.confirmar { background: var(--verde-marca); color: #fff; text-decoration: none; padding: 7px 12px; border-radius: 6px; margin-left: 8px; }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="app-nav">
    <div class="logo-nav-wrap"><img src="../assets/logo-tweetalig.png" alt="Tweetalig"></div>
    <h1>Portal de notas</h1>
    <div id="menu-rol"></div>
    <a href="#" id="link-salir">Cerrar sesión</a>
  </nav>
  <main class="app-contenido">
    <span class="etiqueta-rol">Estudiantes</span>
    <h2>Estudiantes matriculados</h2>

    <div class="filtros">
      <input type="text" id="filtro-texto" placeholder="Buscar por nombre o cédula...">
      <select id="filtro-sede"><option value="">Todas las sedes</option></select>
      <select id="filtro-clase"><option value="">Todas las clases</option></select>
      <select id="filtro-periodo"><option value="">Todos los períodos</option></select>
    </div>

    <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:14px;">
      <label style="font-size:13px; color:var(--tinta-suave); display:flex; gap:6px; align-items:center;">
        <input type="checkbox" id="chk-movidos"> Mostrar historial de estudiantes movidos de clase
      </label>
      <label style="font-size:13px; color:var(--tinta-suave); display:flex; gap:6px; align-items:center;">
        <input type="checkbox" id="chk-danados"> Solo nombres con caracteres dañados (�)
      </label>
      <button type="button" id="boton-directorio" style="display:none; font-size:12.5px; padding:6px 10px; border:1px dashed var(--azul-profundo); background:none; border-radius:6px; cursor:pointer; color:var(--azul-profundo);">Actualizar directorio de cédulas</button>
      <span id="aviso-directorio" style="font-size:12.5px;"></span>
    </div>

    <p class="contador" id="contador"></p>
    <p style="font-size:12.5px; color:var(--tinta-suave); margin-top:-10px; margin-bottom:16px;">
      Si buscas por cédula, verás todas las matrículas de ese estudiante a lo largo del tiempo (cada ciclo/período es un registro separado).
    </p>

    <table class="tabla-simple">
      <thead><tr><th>No.</th><th>Nombre</th><th>Cédula</th><th>Período</th><th>Correo</th><th>Clase</th><th>Sede</th><th></th></tr></thead>
      <tbody id="lista-estudiantes"></tbody>
    </table>
  </main>
</div>

<script type="module">
  import { requireAuth, registrarLog } from "../js/auth.js?v=3";
  import { db } from "../js/firebase-config.js?v=3";
  import { collection, getDocs, doc, deleteDoc, setDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { cargarDestinos, etiquetaDestino, moverEstudiante, datosDirectorio, normalizar } from "../js/matricula.js?v=1";

  const { usuario, rol, perfil } = await requireAuth(["master", "admin", "coordinador", "secretaria"]);

  let todos = [];

  async function cargarFiltros() {
    const snapSedes = await getDocs(collection(db, "ciudades"));
    const selectSede = document.getElementById("filtro-sede");
    snapSedes.forEach((d) => {
      const opt = document.createElement("option");
      opt.value = d.data().nombre;
      opt.textContent = d.data().nombre;
      selectSede.appendChild(opt);
    });

    const snapClases = await getDocs(collection(db, "clases"));
    const selectClase = document.getElementById("filtro-clase");
    snapClases.forEach((d) => {
      const c = d.data();
      const opt = document.createElement("option");
      opt.value = d.id;
      opt.textContent = `${c.nivel} - ${c.grupo} (${c.ciudadNombre || "—"})`;
      selectClase.appendChild(opt);
    });
  }

  async function cargarEstudiantes() {
    const misSedesEst = perfil?.ciudadIds || (perfil?.ciudadId ? [perfil.ciudadId] : []);
    const restringidoPorSede = (rol === "coordinador" || rol === "secretaria") && misSedesEst.length > 0;
    const q = restringidoPorSede
      ? query(collection(db, "estudiantes"), where("ciudadId", "in", misSedesEst))
      : collection(db, "estudiantes");

    const snap = await getDocs(q);
    todos = snap.docs.map((d) => ({ id: d.id, ...d.data() }));

    const periodos = [...new Set(todos.filter((e) => e.anio).map((e) => `${e.anio}-${e.periodo}-${e.ciclo}`))].sort().reverse();
    const selectPeriodo = document.getElementById("filtro-periodo");
    selectPeriodo.innerHTML = '<option value="">Todos los períodos</option>';
    periodos.forEach((p) => {
      const [anio, periodo, ciclo] = p.split("-");
      const opt = document.createElement("option");
      opt.value = p;
      opt.textContent = `${anio}-${periodo} / Ciclo ${ciclo}`;
      selectPeriodo.appendChild(opt);
    });

    pintarLista();
  }

  function pintarLista() {
    const texto = document.getElementById("filtro-texto").value.trim().toLowerCase();
    const sede = document.getElementById("filtro-sede").value;
    const claseId = document.getElementById("filtro-clase").value;
    const periodo = document.getElementById("filtro-periodo").value;

    const verMovidos = document.getElementById("chk-movidos").checked;

    const filtrados = todos.filter((e) => {
      if (e.estado === "movido" && !verMovidos) return false;
      if (document.getElementById("chk-danados").checked && !/\uFFFD/.test(`${e.nombre || ""}${e.apellido || ""}`)) return false;
      const coincideTexto = !texto ||
        (e.nombre || "").toLowerCase().includes(texto) ||
        (e.apellido || "").toLowerCase().includes(texto) ||
        (e.cedula || "").includes(texto);
      const coincideSede = !sede || e.ciudadNombre === sede;
      const coincideClase = !claseId || e.claseId === claseId;
      const coincidePeriodo = !periodo || `${e.anio}-${e.periodo}-${e.ciclo}` === periodo;
      return coincideTexto && coincideSede && coincideClase && coincidePeriodo;
    });

    document.getElementById("contador").textContent = `${filtrados.length} estudiante(s) encontrados de ${todos.length} en total.`;

    filtrados.sort((a, b) => (a.apellido || "").localeCompare(b.apellido || ""));

    const cuerpo = document.getElementById("lista-estudiantes");
    cuerpo.innerHTML = "";
    filtrados.forEach((e, idx) => {
      const fila = document.createElement("tr");
      const movido = e.estado === "movido";
      if (movido) fila.className = "fila-movida";
      const marca = e.reporte
        ? (e.reporte.tipo === "agregado_por_profesor" ? ' <span style="font-size:11px; color:#2d6a58;">· añadido por profesor</span>' : ' <span style="font-size:11px; color:#7a5d00;">· reportado por profesor</span>')
        : "";
      fila.innerHTML = `
        <td>${movido ? "—" : idx + 1}</td>
        <td>${e.apellido || ""} ${e.nombre || ""}${marca}</td>
        <td>${e.cedula || "—"}</td>
        <td>${e.anio ? `${e.anio}-${e.periodo} / Ciclo ${e.ciclo}` : "—"}</td>
        <td>${e.correo || "—"}</td>
        <td>${e.claseTexto || "—"}${movido ? `<br><span style="font-size:11.5px;">Movido a ${e.movidoATexto || "otra clase"}</span>` : ""}</td>
        <td>${e.ciudadNombre || "—"}</td>
        <td style="white-space:nowrap;">${movido ? "" : `<button class="btn-mover" data-id="${e.id}">Mover</button><button class="btn-corregir" data-id="${e.id}" style="color:var(--azul-profundo); margin-right:10px;">Corregir nombre</button><button class="btn-borrar" data-id="${e.id}" data-nombre="${e.nombre} ${e.apellido}">Quitar</button>`}</td>
      `;
      cuerpo.appendChild(fila);
    });

    cuerpo.querySelectorAll(".btn-mover").forEach((b) => b.addEventListener("click", () => abrirMover(b)));
    cuerpo.querySelectorAll(".btn-corregir").forEach((b) => b.addEventListener("click", () => abrirCorregir(b)));

    cuerpo.querySelectorAll(".btn-borrar").forEach((b) => b.addEventListener("click", async () => {
      if (confirm(`¿Quitar a ${b.dataset.nombre} de esta clase?`)) {
        await deleteDoc(doc(db, "estudiantes", b.dataset.id));
        await registrarLog(usuario, rol, "Quitó estudiante", `${b.dataset.nombre} (${b.dataset.id})`);
        await cargarEstudiantes();
      }
    }));
  }

  // Corrige nombre y apellido (por ejemplo los que quedaron con "�"). Se aplica a
  // todas las matrículas de esa cédula y al buscador de cédulas.
  function abrirCorregir(boton) {
    const est = todos.find((x) => x.id === boton.dataset.id);
    if (!est) return;
    const filaActual = boton.closest("tr");
    const previa = filaActual.nextElementSibling;
    if (previa && previa.classList.contains("fila-corregir")) { previa.remove(); return; }
    const fila = document.createElement("tr");
    fila.className = "fila-corregir";
    const esc = (t) => String(t || "").replace(/"/g, "&quot;");
    fila.innerHTML = `<td colspan="8" style="background:#f4f7f9; padding:10px;">
      <span style="font-size:12.5px; color:var(--tinta-suave);">Corregir nombre de la cédula ${est.cedula}: </span>
      <input type="text" class="corr-nombre" value="${esc(est.nombre)}" placeholder="Nombre" style="padding:6px 8px; width:200px;">
      <input type="text" class="corr-apellido" value="${esc(est.apellido)}" placeholder="Apellido" style="padding:6px 8px; width:200px;">
      <button type="button" class="corr-guardar">Guardar</button>
      <button type="button" class="corr-cancelar">Cancelar</button>
      <span class="corr-aviso" style="font-size:12.5px; margin-left:8px;"></span>
    </td>`;
    filaActual.after(fila);
    fila.querySelector(".corr-cancelar").addEventListener("click", () => fila.remove());
    fila.querySelector(".corr-guardar").addEventListener("click", async () => {
      const nombre = fila.querySelector(".corr-nombre").value.trim();
      const apellido = fila.querySelector(".corr-apellido").value.trim();
      const aviso = fila.querySelector(".corr-aviso");
      if (!nombre || !apellido) { aviso.style.color = "var(--error)"; aviso.textContent = "Escribe nombre y apellido."; return; }
      if (/\uFFFD/.test(nombre + apellido)) { aviso.style.color = "var(--error)"; aviso.textContent = "Todavía tiene el rombo (�)."; return; }
      aviso.style.color = ""; aviso.textContent = "Guardando...";
      try {
        const matriculas = todos.filter((x) => x.cedula === est.cedula);
        for (const m of matriculas) await updateDoc(doc(db, "estudiantes", m.id), { nombre, apellido });
        try {
          await setDoc(doc(db, "directorio_estudiantes", String(est.cedula)),
            { cedula: est.cedula, nombre, apellido, busqueda: normalizar(`${apellido} ${nombre}`), busquedaInv: normalizar(`${nombre} ${apellido}`) },
            { merge: true });
        } catch (e) { console.warn("No se pudo actualizar el directorio:", e); }
        await registrarLog(usuario, rol, "Corrigió nombre de estudiante", `${est.cedula}: ${est.apellido} ${est.nombre} → ${apellido} ${nombre}`);
        matriculas.forEach((m) => { m.nombre = nombre; m.apellido = apellido; });
        pintarLista();
      } catch (error) {
        aviso.style.color = "var(--error)";
        aviso.textContent = error.code === "permission-denied" ? "No tienes permiso o el período está cerrado." : `No se pudo guardar (${error.code || error.message}).`;
      }
    });
  }

  // Fila desplegable con las clases a las que se puede mover el estudiante.
  async function abrirMover(boton) {
    const filaActual = boton.closest("tr");
    const abierta = filaActual.nextElementSibling;
    if (abierta && abierta.classList.contains("fila-mover")) { abierta.remove(); return; }

    const est = todos.find((x) => x.id === boton.dataset.id);
    const filaMover = document.createElement("tr");
    filaMover.className = "fila-mover";
    filaMover.innerHTML = `<td colspan="8">Buscando clases disponibles...</td>`;
    filaActual.after(filaMover);

    try {
      const destinos = await cargarDestinos(est, rol, perfil);
      if (destinos.length === 0) {
        filaMover.innerHTML = `<td colspan="8">No hay otras clases del mismo año y período${(rol === "coordinador" || rol === "secretaria") ? " en tus sedes" : ""} a las que moverlo.</td>`;
        return;
      }
      filaMover.innerHTML = `<td colspan="8">
        <b>Mover a ${est.apellido} ${est.nombre}</b> (hoy en ${est.claseTexto || "—"}) a:
        <select class="sel-destino"><option value="">Selecciona la clase...</option>${destinos.map((c, i) => `<option value="${i}">${etiquetaDestino(c)}</option>`).join("")}</select>
        <button type="button" class="confirmar">Mover</button>
        <p style="font-size:12px; color:var(--tinta-suave); margin:6px 0 0;">Sus notas y asistencia quedan en la clase anterior como historial; en la clase nueva empieza en blanco.</p>
        <span class="msg-mover" style="font-size:12.5px;"></span>
      </td>`;
      filaMover.querySelector(".confirmar").addEventListener("click", async (ev) => {
        const valorDestino = filaMover.querySelector(".sel-destino").value;
        if (valorDestino === "") { alert("Selecciona primero la clase a la que lo vas a mover."); return; }
        const destino = destinos[Number(valorDestino)];
        if (!confirm(`¿Mover a ${est.apellido} ${est.nombre} a ${etiquetaDestino(destino)}?`)) return;
        ev.target.disabled = true;
        try {
          await moverEstudiante({ est, destino, usuario, rol });
          await cargarEstudiantes();
        } catch (error) {
          ev.target.disabled = false;
          const msg = filaMover.querySelector(".msg-mover");
          msg.style.color = "var(--error)";
          msg.textContent = error.code === "permission-denied" ? "No tienes permiso para mover a ese estudiante o a esa sede." : (error.message || error.code);
        }
      });
    } catch (error) {
      filaMover.innerHTML = `<td colspan="8" style="color:var(--error);">No se pudo cargar las clases (${error.code || error.message}).</td>`;
    }
  }

  // Solo Master/Admin: reconstruye el directorio de cédulas con los estudiantes ya cargados.
  if (rol === "master" || rol === "admin") {
    const botonDir = document.getElementById("boton-directorio");
    botonDir.style.display = "inline-block";
    botonDir.addEventListener("click", async () => {
      const aviso = document.getElementById("aviso-directorio");
      botonDir.disabled = true;
      aviso.style.color = "var(--tinta-suave)";
      aviso.textContent = "Actualizando...";
      try {
        // Para cada cédula se toma su matrícula MÁS RECIENTE que siga activa
        // (no movida) y se guarda en qué clase está, con el nombre de su profesor.
        const snapClases = await getDocs(collection(db, "clases"));
        const clasesPorId = {};
        snapClases.forEach((d) => { clasesPorId[d.id] = { id: d.id, ...d.data() }; });
        const clavePeriodo = (e) => (Number(e.anio) || 0) * 10000 + (Number(e.periodo) || 0) * 100 + (Number(e.ciclo) || 0);

        const porCedula = new Map();
        for (const e of todos) {
          if (!e.cedula) continue;
          const actual = porCedula.get(e.cedula);
          const esActiva = e.estado !== "movido";
          if (!actual) { porCedula.set(e.cedula, { base: e, activa: esActiva ? e : null }); continue; }
          if (esActiva && (!actual.activa || clavePeriodo(e) > clavePeriodo(actual.activa))) actual.activa = e;
        }

        let n = 0;
        for (const { base, activa } of porCedula.values()) {
          const fuente = activa || base;
          const clase = activa ? clasesPorId[activa.claseId] : null;
          const ficha = datosDirectorio(fuente, clase, activa ? activa.id : null);
          // Reemplaza la ficha completa (así también se elimina el correo de fichas antiguas).
          await setDoc(doc(db, "directorio_estudiantes", base.cedula), ficha);
          n++;
        }
        aviso.style.color = "#2E6E4E";
        aviso.textContent = `Directorio actualizado: ${n} estudiante(s).`;
      } catch (error) {
        aviso.style.color = "var(--error)";
        aviso.textContent = `No se pudo actualizar (${error.code || error.message}).`;
      }
      botonDir.disabled = false;
    });
  }

  document.getElementById("chk-movidos").addEventListener("change", pintarLista);
  document.getElementById("chk-danados").addEventListener("change", pintarLista);
  document.getElementById("filtro-texto").addEventListener("input", pintarLista);
  document.getElementById("filtro-sede").addEventListener("change", pintarLista);
  document.getElementById("filtro-clase").addEventListener("change", pintarLista);
  document.getElementById("filtro-periodo").addEventListener("change", pintarLista);

  await Promise.all([cargarFiltros(), cargarEstudiantes()]);
</script>
</body>
</html>
