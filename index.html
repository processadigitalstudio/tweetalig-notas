<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweetalig — Portal de notas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main class="pantalla-login">
  <div class="tarjeta-login">
    <div class="marca">
      <img src="assets/logo-tweetalig.png" alt="Tweetalig">
      <h1>Portal de notas</h1>
    </div>

    <p class="texto-login">Ingresa con tu cuenta de correo de Tweetalig.</p>

    <button type="button" id="boton-google" class="boton-google">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62Z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.33A9 9 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.94A9 9 0 0 0 0 9c0 1.45.35 2.83.94 4.03l3.01-2.33Z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58A8.6 8.6 0 0 0 9 0 9 9 0 0 0 .94 4.97l3.01 2.33C4.66 5.17 6.65 3.58 9 3.58Z"/></svg>
      Entrar con Google
    </button>

    <p id="mensaje-error" class="mensaje-error" role="alert"></p>
  </div>
</main>

<script type="module" src="js/login.js"></script>
</body>
</html>
